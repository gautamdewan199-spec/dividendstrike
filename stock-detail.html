        // Technical indicators calculator
        function calcEMA(data, period) {
            const k = 2 / (period + 1);
            let ema = [data[0]];
            for (let i = 1; i < data.length; i++) ema.push(data[i] * k + ema[i - 1] * (1 - k));
            return ema;
        }
        function calcRSI(prices, period = 14) {
            if (prices.length < period + 1) return Array(prices.length).fill(50);
            let gains = [], losses = [], rsi = Array(period).fill(null);
            for (let i = 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i - 1];
                gains.push(diff > 0 ? diff : 0);
                losses.push(diff < 0 ? -diff : 0);
            }
            let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
            let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
            rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
            for (let i = period; i < gains.length; i++) {
                avgGain = (avgGain * (period - 1) + gains[i]) / period;
                avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
                rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
            }
            return rsi;
        }
        
        // Generate mock price data
        function generatePriceData(basePrice, days = 200) {
            const prices = [];
            let price = basePrice * 0.85;
            const volatility = basePrice * 0.02;
            for (let i = 0; i < days; i++) {
                price += (Math.random() - 0.48) * volatility;
                price = Math.max(price, basePrice * 0.6);
                price = Math.min(price, basePrice * 1.4);
                prices.push(parseFloat(price.toFixed(2)));
            }
            prices.push(basePrice);
            return prices;
        }
        
        // Generate company news
        function generateNews(symbol, name) {
            const company = name.split(' ')[0];
            const templates = [
                {t:'📊 Results',c:'positive',text:`${company} reports strong quarterly results — revenue up 12% YoY`},
                {t:'💰 Dividend',c:'positive',text:`${company} declares interim dividend of ₹${(Math.random()*20+5).toFixed(1)} per share`},
                {t:'📈 Analyst',c:'positive',text:`Brokerage upgrades ${symbol} to BUY with target price ₹${(Math.random()*5000+500).toFixed(0)}`},
                {t:'🏢 Corporate',c:'neutral',text:`${company} announces capacity expansion plan with ₹${(Math.random()*5000+500).toFixed(0)} crore investment`},
                {t:'📊 Technical',c:'neutral',text:`${symbol} shows bullish EMA crossover on daily charts — traders watch for breakout`},
                {t:'📰 Market',c:'negative',text:`Sector faces headwinds amid global uncertainty — ${company} may see short-term pressure`},
                {t:'💰 Dividend',c:'positive',text:`${company} fixes record date for upcoming dividend payment`},
                {t:'📈 Technical',c:'positive',text:`RSI indicates oversold levels for ${symbol} — potential bounce back expected`},
            ];
            const news = [];
            for(let i=0;i<6;i++){
                const t=templates[Math.floor(Math.random()*templates.length)];
                const h=Math.floor(Math.random()*48);
                news.push({...t,time:h<1?'Just now':h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`});
            }
            return news.sort((a,b)=>a.time.localeCompare(b.time));
        }

                ${s.paysDividend?`
                <div class="card">
                    <div class="card-header"><span class="card-title">📋 Dividend Payment History (6 Years)</span></div>
                    <div style="overflow-x:auto;"><table><thead><tr><th>Date</th><th>Type</th><th>DPS (₹)</th><th>Yield %</th><th>Growth</th></tr></thead><tbody>
                    ${(s.dividendHistory||[]).map((d,i,arr)=>{const prev=i>0?arr[i-1].dividendPerShare:d.dividendPerShare;const g=prev>0?((d.dividendPerShare-prev)/prev*100):0;return`<tr><td>${d.date}</td><td><span class="badge ${d.type==='Final'?'badge-blue':'badge-yellow'}">${d.type}</span></td><td style="font-weight:600;">₹${d.dividendPerShare.toFixed(2)}</td><td class="text-green">${d.yield.toFixed(2)}%</td><td class="${g>=0?'text-green':'text-red'}">${g>0?'+':''}${g.toFixed(1)}%</td></tr>`;}).join('')}
                    </tbody></table></div>
                </div>
                <div class="card"><div class="card-header"><span class="card-title">📊 Dividend Growth Chart</span></div><div style="height:250px;"><canvas id="dividendChart"></canvas></div></div>
                `:'<div class="card text-center" style="padding:40px;"><p class="text-secondary">🚫 This company does not pay dividends.</p></div>'}
            </div>
            
            <!-- TECHNICAL TAB -->
            <div id="tab-technical" class="tab-content" style="display:none;">
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;">
                    <div class="card text-center signal-card signal-${emaSignal.c==='green'?'buy':'sell'}"><p style="font-size:11px;color:#6b7280;">EMA 9/21 Crossover</p><p style="font-size:24px;font-weight:900;color:${emaSignal.c==='green'?'#22c55e':'#ef4444'};">${emaSignal.s}</p><p style="font-size:11px;color:#6b7280;">${emaSignal.t}</p></div>
                    <div class="card text-center signal-card signal-${rsiSignal.c==='green'?'buy':rsiSignal.c==='red'?'sell':'neutral'}"><p style="font-size:11px;color:#6b7280;">RSI (14)</p><p style="font-size:24px;font-weight:900;color:${rsiSignal.c==='green'?'#22c55e':rsiSignal.c==='red'?'#ef4444':'#eab308'};">${lastRSI.toFixed(0)}</p><p style="font-size:11px;color:#6b7280;">${rsiSignal.t}</p></div>
                    <div class="card text-center"><p style="font-size:11px;color:#6b7280;">Price Action</p><p style="font-size:24px;font-weight:900;color:#22c55e;">₹${lastPrice.toFixed(2)}</p><p style="font-size:11px;color:#6b7280;">200-day range analysis</p></div>
                </div>
                <div class="card"><div class="card-header"><span class="card-title">📈 Price Chart with EMA Crossovers</span><span class="text-xs text-muted">9/21/50 EMA</span></div><div style="height:350px;"><canvas id="techChart"></canvas></div></div>
                <div class="card"><div class="card-header"><span class="card-title">📊 RSI Indicator (14)</span><span class="text-xs text-muted">Overbought >70 | Oversold <30</span></div><div style="height:200px;"><canvas id="rsiChart"></canvas></div></div>
            </div>
            
            <!-- FUNDAMENTAL TAB -->
            <div id="tab-fundamental" class="tab-content" style="display:none;">
                <div class="card"><div class="card-header"><span class="card-title">🏢 Fundamental Metrics</span></div>
                    <div class="metric-grid">
                        <div class="metric-card"><p class="metric-value">₹${s.price.toFixed(2)}</p><p class="metric-label">Current Price</p></div>
                        <div class="metric-card"><p class="metric-value">${s.pe}</p><p class="metric-label">P/E Ratio</p></div>
                        <div class="metric-card"><p class="metric-value">₹${s.eps}</p><p class="metric-label">EPS</p></div>
                        <div class="metric-card"><p class="metric-value">${s.roe}%</p><p class="metric-label">ROE</p></div>
                        <div class="metric-card"><p class="metric-value">${s.de.toFixed(2)}</p><p class="metric-label">Debt/Equity</p></div>
                        <div class="metric-card"><p class="metric-value">${s.promoter}%</p><p class="metric-label">Promoter Holding</p></div>
                        <div class="metric-card"><p class="metric-value text-green">${s.paysDividend?s.payoutRatio+'%':'—'}</p><p class="metric-label">Payout Ratio</p></div>
                        <div class="metric-card"><p class="metric-value">${s.buybackHistory}</p><p class="metric-label">Buybacks</p></div>
                    </div>
                </div>
            </div>
            
            <!-- NEWS TAB -->
            <div id="tab-news" class="tab-content" style="display:none;">
                <div class="card"><div class="card-header"><span class="card-title">📰 Latest ${s.name.split(' ')[0]} News & Updates</span></div>
                    ${news.map(n=>`<div class="news-item"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span class="badge badge-${n.c==='positive'?'green':n.c==='negative'?'red':'blue'}">${n.t}</span><span class="text-xs text-muted">${n.time}</span></div><p class="text-sm text-secondary">${n.text}</p></div>`).join('')}
                </div>
            </div>`;
            
            // Render charts after DOM update
            setTimeout(() => {
                if (s.paysDividend) renderDividendChart(s);
                renderTechnicalCharts(priceData, ema9, ema21, ema50, rsiData);
            }, 300);
        }
        
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).style.display = 'block';
            btn.classList.add('active');
        }
        
        function renderDividendChart(s) {
            const ctx = document.getElementById('dividendChart');
            if (!ctx) return;
            const data = s.dividendHistory || [];
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.date.split('-')[0]),
                    datasets: [{label:'DPS (₹)',data:data.map(d=>d.dividendPerShare),backgroundColor:'rgba(34,197,94,0.4)',borderColor:'#22c55e',borderWidth:1,borderRadius:6}]
                },
                options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280'},grid:{display:false}},y:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}}}
            });
        }
        
        function renderTechnicalCharts(prices, ema9, ema21, ema50, rsi) {
            const ctx1 = document.getElementById('techChart');
            if (ctx1) {
                new Chart(ctx1, {
                    type:'line',
                    data:{
                        labels:Array.from({length:prices.length},(_,i)=>i),
                        datasets:[
                            {label:'Price',data:prices,borderColor:'#e5e7eb',borderWidth:1.5,pointRadius:0,tension:0.3},
                            {label:'EMA 9',data:ema9,borderColor:'#22c55e',borderWidth:1,pointRadius:0,tension:0.3},
                            {label:'EMA 21',data:ema21,borderColor:'#f59e0b',borderWidth:1,pointRadius:0,tension:0.3},
                            {label:'EMA 50',data:ema50,borderColor:'#3b82f6',borderWidth:1,pointRadius:0,tension:0.3}
                        ]
                    },
                    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af',usePointStyle:true,pointStyleWidth:8}}},scales:{x:{display:false},y:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}},interaction:{intersect:false,mode:'index'}}
                });
            }
            const ctx2 = document.getElementById('rsiChart');
            if (ctx2) {
                new Chart(ctx2, {
                    type:'line',
                    data:{
                        labels:Array.from({length:rsi.length},(_,i)=>i),
                        datasets:[
                            {label:'RSI (14)',data:rsi,borderColor:'#a855f7',borderWidth:2,pointRadius:0,fill:false},
                            {label:'Overbought (70)',data:Array(rsi.length).fill(70),borderColor:'rgba(239,68,68,0.3)',borderWidth:1,borderDash:[5,5],pointRadius:0},
                            {label:'Oversold (30)',data:Array(rsi.length).fill(30),borderColor:'rgba(34,197,94,0.3)',borderWidth:1,borderDash:[5,5],pointRadius:0}
                        ]
                    },
                    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{min:0,max:100,ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}}}
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded',()=>{handleScroll();loadStockDetail();console.log('📊 Stock Dashboard loaded');});
    </script>
</body>
</html>
