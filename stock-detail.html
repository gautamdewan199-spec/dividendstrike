    <script>
        function toggleMobileMenu(){const m=document.getElementById('mobileMenu');m.style.display=(m.style.display==='none'||m.style.display==='')?'grid':'none';}
        document.addEventListener('click',e=>{const m=document.getElementById('mobileMenu');const b=document.querySelector('.mobile-menu-btn');if(m&&b&&!m.contains(e.target)&&!b.contains(e.target))m.style.display='none';});

        function getParam(p){return new URLSearchParams(window.location.search).get(p);}

        // ============================================
        // TECHNICAL ANALYSIS AI ENGINE
        // ============================================
        const TechnicalAI = {
            extractPrices(data) { return data.map(d => d.price); },
            calcEMA(data, period) {
                const prices = this.extractPrices(data);
                const k = 2 / (period + 1);
                let ema = [prices[0]];
                for (let i = 1; i < prices.length; i++) ema.push(prices[i] * k + ema[i - 1] * (1 - k));
                return ema;
            },
            calcRSI(data, period = 14) {
                const prices = this.extractPrices(data);
                if (prices.length < period + 1) return Array(prices.length).fill(50);
                let gains = [], losses = [], rsi = Array(period).fill(null);
                for (let i = 1; i < prices.length; i++) {
                    const diff = prices[i] - prices[i - 1];
                    gains.push(diff > 0 ? diff : 0); losses.push(diff < 0 ? -diff : 0);
                }
                let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
                let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
                rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
                for (let i = period; i < gains.length; i++) {
                    avgGain = (avgGain * (period - 1) + gains[i]) / period;
                    avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
                    rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
                }
                return rsi;
            },
            calcMACD(data, fast = 12, slow = 26, signal = 9) {
                const emaFast = this.calcEMA(data, fast);
                const emaSlow = this.calcEMA(data, slow);
                const macdLine = emaFast.map((v, i) => v - emaSlow[i]);
                const prices = this.extractPrices(data);
                const signalLine = this.calcEMA(macdLine.map(v => ({price: v})), signal);
                const histogram = macdLine.map((v, i) => v - signalLine[i]);
                return { macdLine, signalLine, histogram };
            },
            checkEMACrossover(data) {
                const prices = this.extractPrices(data);
                const ema9 = this.calcEMA(data, 9);
                const ema21 = this.calcEMA(data, 21);
                const ema50 = this.calcEMA(data, 50);
                const ema200 = this.calcEMA(data, 200);
                const lastIdx = prices.length - 1;
                return {
                    ema9: ema9[lastIdx], ema21: ema21[lastIdx], ema50: ema50[lastIdx], ema200: ema200[lastIdx],
                    currentPrice: prices[lastIdx],
                    shortTermTrend: ema9[lastIdx] > ema21[lastIdx] ? 'Bullish' : 'Bearish',
                    mediumTermTrend: ema21[lastIdx] > ema50[lastIdx] ? 'Bullish' : 'Bearish',
                    longTermTrend: ema50[lastIdx] > ema200[lastIdx] ? 'Bullish' : 'Bearish',
                    justCrossedUp: ema9[lastIdx-1] <= ema21[lastIdx-1] && ema9[lastIdx] > ema21[lastIdx],
                    justCrossedDown: ema9[lastIdx-1] >= ema21[lastIdx-1] && ema9[lastIdx] < ema21[lastIdx],
                    ema9_21: ema9, ema21_21: ema21, ema50_21: ema50, ema200_21: ema200
                };
            },
            interpretRSI(rsiValue) {
                if (rsiValue < 20) return { signal: 'STRONG BUY', color: '#22c55e', text: 'Extremely Oversold', strength: 95 };
                if (rsiValue < 30) return { signal: 'BUY', color: '#4ade80', text: 'Oversold — Buying opportunity', strength: 75 };
                if (rsiValue < 45) return { signal: 'WEAK BUY', color: '#a3e635', text: 'Approaching oversold', strength: 55 };
                if (rsiValue < 55) return { signal: 'NEUTRAL', color: '#eab308', text: 'Neutral zone', strength: 50 };
                if (rsiValue < 70) return { signal: 'WEAK SELL', color: '#f97316', text: 'Approaching overbought', strength: 45 };
                if (rsiValue < 80) return { signal: 'SELL', color: '#ef4444', text: 'Overbought — Correction likely', strength: 25 };
                return { signal: 'STRONG SELL', color: '#dc2626', text: 'Extremely Overbought', strength: 5 };
            },
            getOverallSentiment(emaData, rsiValue, macdData) {
                let score = 40;
                if (emaData.shortTermTrend === 'Bullish') score += 15; else score -= 15;
                if (emaData.mediumTermTrend === 'Bullish') score += 10; else score -= 10;
                if (emaData.longTermTrend === 'Bullish') score += 5; else score -= 5;
                if (emaData.justCrossedUp) score += 15;
                if (emaData.justCrossedDown) score -= 15;
                if (rsiValue < 30) score += 15; else if (rsiValue > 70) score -= 15;
                const lastMACD = macdData.macdLine[macdData.macdLine.length - 1];
                const lastSignal = macdData.signalLine[macdData.signalLine.length - 1];
                if (lastMACD > lastSignal) score += 10; else score -= 10;
                const clamped = Math.max(5, Math.min(95, score));
                let s, c, e, d;
                if (clamped >= 75) { s = 'BULLISH'; c = '#22c55e'; e = '🟢'; d = 'Strong bullish signals.'; }
                else if (clamped >= 55) { s = 'MODERATELY BULLISH'; c = '#4ade80'; e = '🟡'; d = 'Most indicators positive.'; }
                else if (clamped >= 45) { s = 'NEUTRAL'; c = '#eab308'; e = '⚪'; d = 'Mixed signals. Wait for confirmation.'; }
                else if (clamped >= 25) { s = 'MODERATELY BEARISH'; c = '#f97316'; e = '🟠'; d = 'Multiple weak signals.'; }
                else { s = 'BEARISH'; c = '#ef4444'; e = '🔴'; d = 'Strong bearish signals.'; }
                return { score: clamped, sentiment: s, color: c, emoji: e, description: d };
            },
            generatePriceData(basePrice, days = 250) {
                const data = [];
                let price = basePrice * 0.75 + (Math.random() * basePrice * 0.1);
                const volatility = basePrice * 0.018;
                const today = new Date();
                let currentDate = new Date(today);
                currentDate.setDate(currentDate.getDate() - days);
                let daysGenerated = 0;
                while (daysGenerated < days) {
                    currentDate.setDate(currentDate.getDate() + 1);
                    if (currentDate.getDay() === 0 || currentDate.getDay() === 6) continue;
                    price += (Math.random() - 0.48) * volatility;
                    price = Math.max(price, basePrice * 0.55);
                    price = Math.min(price, basePrice * 1.5);
                    data.push({ date: new Date(currentDate).toISOString().split('T')[0], price: parseFloat(price.toFixed(2)) });
                    daysGenerated++;
                }
                return data;
            }
        };

        function generateNews(symbol, name) {
            const company = name.split(' ')[0];
            const templates = [
                {t:'Results',c:'positive',text:`${company} reports strong quarterly results — revenue up 12% YoY`},
                {t:'Dividend',c:'positive',text:`${company} declares interim dividend`},
                {t:'Analyst',c:'positive',text:`Brokerage upgrades ${symbol} to BUY`},
                {t:'Corporate',c:'neutral',text:`${company} announces expansion plan`},
                {t:'Technical',c:'neutral',text:`${symbol} shows EMA crossover on daily charts`},
                {t:'Market',c:'negative',text:`Sector faces headwinds`},
            ];
            const news = [];
            for(let i=0;i<5;i++){const t=templates[Math.floor(Math.random()*templates.length)];const h=Math.floor(Math.random()*48);news.push({...t,time:h<1?'Just now':h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`});}
            return news;
        }

        function loadStockDetail() {
            const symbol = getParam('symbol');
            const container = document.getElementById('stockDetailContainer');
            
            if(!symbol){
                container.innerHTML=`<div class="text-center" style="padding:60px;"><h2 style="font-size:24px;font-weight:900;">🔍 No Stock Selected</h2><p class="text-secondary mt-2">Use our screener to find stocks.</p><a href="screener.html" class="btn btn-primary" style="margin-top:16px;">Go to Screener</a></div>`;
                return;
            }
            
            const s=stocks.find(st=>st.symbol===symbol.toUpperCase());
            if(!s){
                container.innerHTML=`<div class="text-center" style="padding:60px;"><h2 style="font-size:24px;font-weight:900;">Stock Not Found</h2><p class="text-secondary">"${symbol}" not in database.</p><a href="screener.html" class="btn btn-primary" style="margin-top:16px;">Browse Stocks</a></div>`;
                return;
            }

            // Daily update check (MOVED HERE - after `s` is defined)
            const lastUpdateKey = `ds_price_update_${s.symbol}`;
            const lastUpdate = localStorage.getItem(lastUpdateKey);
            const today = new Date().toISOString().split('T')[0];
            if (lastUpdate !== today) {
                console.log(`🔄 Fresh data for ${s.symbol} (last: ${lastUpdate||'never'})`);
                localStorage.setItem(lastUpdateKey, today);
            }

            updateDynamicSEO(s);
            const h=AI.health(s);const p=AI.growth(s);const r=AI.rec(s);const su=AI.sustain(s);
            const priceData=TechnicalAI.generatePriceData(s.price,250);
            const emaData=TechnicalAI.checkEMACrossover(priceData);
            const rsiData=TechnicalAI.calcRSI(priceData,14);
            const macdData=TechnicalAI.calcMACD(priceData);
            const lastRSI=rsiData[rsiData.length-1];
            const rsiInterpretation=TechnicalAI.interpretRSI(lastRSI);
            const techSentiment=TechnicalAI.getOverallSentiment(emaData,lastRSI,macdData);
            const lastMACD=macdData.macdLine[macdData.macdLine.length-1];
            const lastSignal=macdData.signalLine[macdData.signalLine.length-1];
            const macdBullish=lastMACD>lastSignal;
            const news=generateNews(s.symbol,s.name);

            container.innerHTML=`
            <a href="screener.html" style="color:#9ca3af;font-size:13px;display:inline-block;margin-bottom:20px;">← Back to Screener</a>
            <div class="card" style="padding:28px 32px;margin-bottom:20px;background:linear-gradient(135deg,rgba(15,15,25,0.9),rgba(10,10,20,0.9));">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;">
                    <div>
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><h1 style="font-size:28px;font-weight:900;">${s.symbol}</h1><span class="badge badge-green">NSE</span>${h>=80?'<span class="badge badge-yellow">⭐ Top Pick</span>':''}</div>
                        <p style="color:#9ca3af;font-size:15px;">${s.name} • ${s.sector}</p>
                        <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:#6b7280;"><span>Mkt Cap: ${s.mcap}</span><span>P/E: ${s.pe}</span><span>EPS: ₹${s.eps}</span><span>ROE: ${s.roe}%</span></div>
                    </div>
                    <div class="text-center"><div style="font-size:32px;font-weight:900;color:#22c55e;">₹${s.price.toFixed(2)}</div><div style="font-size:36px;font-weight:900;color:${h>=80?'#22c55e':h>=60?'#3b82f6':h>=35?'#eab308':'#ef4444'};">${h}</div><p style="font-size:11px;color:#6b7280;">AI Health Score / 100</p></div>
                </div>
                <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;"><a href="calculators.html" class="btn btn-primary btn-sm">🧮 Calculate DRIP</a></div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchDetailTab('overview',this)">📊 Overview</button>
                <button class="tab" onclick="switchDetailTab('dividend',this)">💰 Dividend History</button>
                <button class="tab" onclick="switchDetailTab('technical',this)">📈 Technical Analysis</button>
                <button class="tab" onclick="switchDetailTab('fundamental',this)">🏢 Fundamentals</button>
                <button class="tab" onclick="switchDetailTab('news',this)">📰 News</button>
            </div>

            <div id="tab-overview" class="tab-content">
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">
                    <div class="card text-center" style="padding:20px;"><p style="font-size:11px;color:#6b7280;">Dividend Yield</p><p style="font-size:28px;font-weight:900;color:#22c55e;">${s.paysDividend?s.divYield.toFixed(2)+'%':'—'}</p></div>
                    <div class="card text-center" style="padding:20px;"><p style="font-size:11px;color:#6b7280;">3Y Growth</p><p style="font-size:28px;font-weight:900;color:#3b82f6;">${s.paysDividend?(p.cagr>0?'+':'')+p.cagr+'%':'—'}</p></div>
                    <div class="card text-center" style="padding:20px;"><p style="font-size:11px;color:#6b7280;">Sustainability</p><p style="font-size:28px;font-weight:900;color:${su.c==='green'?'#22c55e':'#eab308'};">${su.sc}</p></div>
                    <div class="card text-center" style="padding:20px;"><p style="font-size:11px;color:#6b7280;">Technical</p><p style="font-size:22px;font-weight:900;color:${techSentiment.color};">${techSentiment.sentiment}</p></div>
                </div>
            </div>

            <div id="tab-dividend" class="tab-content" style="display:none;">
                ${s.paysDividend?`
                <div class="card"><div class="card-header"><span class="card-title">📋 Dividend Payment History</span></div><div style="overflow-x:auto;"><table><thead><tr><th>Date</th><th>Type</th><th>DPS (₹)</th><th>Yield %</th><th>Growth</th></tr></thead><tbody>${(s.dividendHistory||[]).map((d,i,arr)=>{const prev=i>0?arr[i-1].dividendPerShare:d.dividendPerShare;const g=prev>0?((d.dividendPerShare-prev)/prev*100):0;return`<tr><td>${d.date}</td><td><span class="badge ${d.type==='Final'?'badge-blue':'badge-yellow'}">${d.type}</span></td><td>₹${d.dividendPerShare.toFixed(2)}</td><td class="text-green">${d.yield.toFixed(2)}%</td><td class="${g>=0?'text-green':'text-red'}">${g>0?'+':''}${g.toFixed(1)}%</td></tr>`;}).join('')}</tbody></table></div></div>
                <div class="card"><div class="card-header"><span class="card-title">📊 Dividend Growth</span></div><div style="height:250px;"><canvas id="dividendChart"></canvas></div></div>
                `:'<div class="card text-center" style="padding:40px;"><p class="text-secondary">🚫 This company does not pay dividends.</p></div>'}
            </div>

            <div id="tab-technical" class="tab-content" style="display:none;">
                <div class="card" style="text-align:center;padding:32px;margin-bottom:20px;background:linear-gradient(135deg,rgba(15,15,25,0.9),rgba(10,10,20,0.9));">
                    <p style="font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;">AI Technical Sentiment</p>
                    <div style="font-size:64px;margin-bottom:12px;">${techSentiment.emoji}</div>
                    <p style="font-size:32px;font-weight:900;color:${techSentiment.color};margin-bottom:8px;">${techSentiment.sentiment}</p>
                    <div style="width:300px;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;margin:0 auto 12px;"><div style="width:${techSentiment.score}%;height:100%;background:${techSentiment.color};border-radius:4px;"></div></div>
                    <p style="font-size:14px;color:#9ca3af;max-width:500px;margin:0 auto;">${techSentiment.description}</p>
                    <p style="font-size:11px;color:#6b7280;margin-top:8px;">Score: <strong style="color:${techSentiment.color};">${techSentiment.score}/100</strong> | 📅 Updated: ${new Date().toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'})}</p>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">
                    <div class="card text-center signal-card signal-${emaData.shortTermTrend==='Bullish'?'buy':'sell'}" style="padding:20px;"><p class="text-xs text-muted">EMA 9/21</p><p style="font-size:20px;font-weight:900;color:${emaData.shortTermTrend==='Bullish'?'#22c55e':'#ef4444'};">${emaData.shortTermTrend.toUpperCase()}</p></div>
                    <div class="card text-center signal-card signal-${emaData.mediumTermTrend==='Bullish'?'buy':'sell'}" style="padding:20px;"><p class="text-xs text-muted">EMA 21/50</p><p style="font-size:20px;font-weight:900;color:${emaData.mediumTermTrend==='Bullish'?'#22c55e':'#ef4444'};">${emaData.mediumTermTrend.toUpperCase()}</p></div>
                    <div class="card text-center signal-card signal-${rsiInterpretation.signal.includes('BUY')?'buy':'sell'}" style="padding:20px;"><p class="text-xs text-muted">RSI (14)</p><p style="font-size:20px;font-weight:900;color:${rsiInterpretation.color};">${rsiInterpretation.signal}</p></div>
                    <div class="card text-center" style="padding:20px;background:${macdBullish?'rgba(34,197,94,0.05)':'rgba(239,68,68,0.05)'};"><p class="text-xs text-muted">MACD</p><p style="font-size:20px;font-weight:900;color:${macdBullish?'#22c55e':'#ef4444'};">${macdBullish?'BULLISH':'BEARISH'}</p></div>
                </div>
                <div class="card"><div class="card-header"><span class="card-title">📈 Price Action with EMAs</span><div style="display:flex;gap:12px;font-size:10px;"><span style="color:#22c55e;">● EMA9</span><span style="color:#f59e0b;">● EMA21</span><span style="color:#3b82f6;">● EMA50</span><span style="color:#a855f7;">● EMA200</span></div></div><div style="height:350px;"><canvas id="techChart"></canvas></div></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;">
                    <div class="card"><div class="card-header"><span class="card-title">📊 RSI (14)</span></div><div style="height:200px;"><canvas id="rsiChart"></canvas></div></div>
                    <div class="card"><div class="card-header"><span class="card-title">📉 MACD</span></div><div style="height:200px;"><canvas id="macdChart"></canvas></div></div>
                </div>
            </div>

            <div id="tab-fundamental" class="tab-content" style="display:none;">
                <div class="card"><div class="card-header"><span class="card-title">🏢 Fundamental Metrics</span></div>
                    <div class="metric-grid">
                        <div class="metric-card"><p class="metric-value">₹${s.price.toFixed(2)}</p><p class="metric-label">Price</p></div>
                        <div class="metric-card"><p class="metric-value">${s.pe}</p><p class="metric-label">P/E</p></div>
                        <div class="metric-card"><p class="metric-value">₹${s.eps}</p><p class="metric-label">EPS</p></div>
                        <div class="metric-card"><p class="metric-value">${s.roe}%</p><p class="metric-label">ROE</p></div>
                        <div class="metric-card"><p class="metric-value">${s.de.toFixed(2)}</p><p class="metric-label">D/E</p></div>
                        <div class="metric-card"><p class="metric-value">${s.promoter}%</p><p class="metric-label">Promoter</p></div>
                        <div class="metric-card"><p class="metric-value text-green">${s.paysDividend?s.payoutRatio+'%':'—'}</p><p class="metric-label">Payout</p></div>
                        <div class="metric-card"><p class="metric-value">${s.buybackHistory}</p><p class="metric-label">Buybacks</p></div>
                    </div>
                </div>
            </div>

            <div id="tab-news" class="tab-content" style="display:none;">
                <div class="card"><div class="card-header"><span class="card-title">📰 Latest ${s.name.split(' ')[0]} News</span></div>
                    ${news.map(n=>`<div class="news-item"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span class="badge badge-${n.c==='positive'?'green':n.c==='negative'?'red':'blue'}">${n.t}</span><span class="text-xs text-muted">${n.time}</span></div><p class="text-sm text-secondary">${n.text}</p></div>`).join('')}
                </div>
            </div>`;

            setTimeout(()=>{
                if(s.paysDividend&&document.getElementById('dividendChart')){
                    const d=s.dividendHistory||[];
                    new Chart(document.getElementById('dividendChart'),{type:'bar',data:{labels:d.map(x=>x.date.split('-')[0]),datasets:[{label:'DPS',data:d.map(x=>x.dividendPerShare),backgroundColor:'rgba(34,197,94,0.4)',borderColor:'#22c55e',borderWidth:1,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280'},grid:{display:false}},y:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}}}});
                }
                renderTechnicalCharts(priceData,emaData,rsiData,macdData);
            },300);
        }

        function switchDetailTab(tabId,btn){
            document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            const el=document.getElementById('tab-'+tabId);if(el)el.style.display='block';
            btn.classList.add('active');
        }

        function renderTechnicalCharts(priceData, emaData, rsiData, macdData) {
            const dates = priceData.map(d => {const dt=new Date(d.date);return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});});
            const prices = priceData.map(d => d.price);
            
            const ctx1=document.getElementById('techChart');
            if(ctx1){new Chart(ctx1,{type:'line',data:{labels:dates,datasets:[{label:'Price',data:prices,borderColor:'#e5e7eb',borderWidth:1.5,pointRadius:0,tension:0.3},{label:'EMA9',data:emaData.ema9_21,borderColor:'#22c55e',borderWidth:1.5,pointRadius:0,tension:0.3},{label:'EMA21',data:emaData.ema21_21,borderColor:'#f59e0b',borderWidth:1.5,pointRadius:0,tension:0.3},{label:'EMA50',data:emaData.ema50_21,borderColor:'#3b82f6',borderWidth:1,pointRadius:0,tension:0.3,borderDash:[3,3]},{label:'EMA200',data:emaData.ema200_21,borderColor:'#a855f7',borderWidth:1,pointRadius:0,tension:0.3,borderDash:[5,5]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af',usePointStyle:true,padding:12}}},scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:10,autoSkip:true},grid:{display:false}},y:{ticks:{color:'#6b7280',callback:v=>'₹'+v.toFixed(0)},grid:{color:'rgba(255,255,255,0.05)'}}}}});}
            
            const ctx2=document.getElementById('rsiChart');
            if(ctx2){new Chart(ctx2,{type:'line',data:{labels:dates,datasets:[{label:'RSI',data:rsiData,borderColor:'#a855f7',borderWidth:2,pointRadius:0,fill:false},{label:'70',data:Array(rsiData.length).fill(70),borderColor:'rgba(239,68,68,0.3)',borderWidth:1,borderDash:[5,5],pointRadius:0},{label:'30',data:Array(rsiData.length).fill(30),borderColor:'rgba(34,197,94,0.3)',borderWidth:1,borderDash:[5,5],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:10},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}}}});}
            
            const ctx3=document.getElementById('macdChart');
            if(ctx3){new Chart(ctx3,{type:'bar',data:{labels:dates,datasets:[{label:'Histogram',data:macdData.histogram,backgroundColor:macdData.histogram.map(v=>v>=0?'rgba(34,197,94,0.5)':'rgba(239,68,68,0.5)'),borderWidth:0},{label:'MACD',data:macdData.macdLine,type:'line',borderColor:'#3b82f6',borderWidth:1.5,pointRadius:0},{label:'Signal',data:macdData.signalLine,type:'line',borderColor:'#f59e0b',borderWidth:1.5,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:10},grid:{display:false}},y:{ticks:{color:'#6b7280'},grid:{color:'rgba(255,255,255,0.05)'}}}}});}
        }

        document.addEventListener('DOMContentLoaded',()=>{handleScroll();loadStockDetail();console.log('📊 Stock Dashboard Ready');});
    </script>
</body>
</html>
