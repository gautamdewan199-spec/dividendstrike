        // ============================================
        // TECHNICAL ANALYSIS AI ENGINE
        // ============================================
        const TechnicalAI = {
            calcEMA(data, period) {
                const k = 2 / (period + 1);
                let ema = [data[0]];
                for (let i = 1; i < data.length; i++) ema.push(data[i] * k + ema[i - 1] * (1 - k));
                return ema;
            },
            calcRSI(prices, period = 14) {
                if (prices.length < period + 1) return Array(prices.length).fill(50);
                let gains = [], losses = [], rsi = Array(period).fill(null);
                for (let i = 1; i < prices.length; i++) {
                    const diff = prices[i] - prices[i - 1];
                    gains.push(diff > 0 ? diff : 0); losses.push(diff < 0 ? -diff : 0);
                }
                let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
                let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;
                rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
                for (let i = period; i < gains.length; i++) {
                    avgGain = (avgGain * (period - 1) + gains[i]) / period;
                    avgLoss = (avgLoss * (period - 1) + losses[i]) / period;
                    rsi.push(100 - (100 / (1 + avgGain / (avgLoss || 1))));
                }
                return rsi;
            },
            calcMACD(prices, fast = 12, slow = 26, signal = 9) {
                const emaFast = this.calcEMA(prices, fast);
                const emaSlow = this.calcEMA(prices, slow);
                const macdLine = emaFast.map((v, i) => v - emaSlow[i]);
                const signalLine = this.calcEMA(macdLine, signal);
                const histogram = macdLine.map((v, i) => v - signalLine[i]);
                return { macdLine, signalLine, histogram };
            },
            checkEMACrossover(prices) {
                const ema9 = this.calcEMA(prices, 9);
                const ema21 = this.calcEMA(prices, 21);
                const ema50 = this.calcEMA(prices, 50);
                const ema200 = this.calcEMA(prices, 200);
                const last9 = ema9[ema9.length - 1];
                const last21 = ema21[ema21.length - 1];
                const last50 = ema50[ema50.length - 1];
                const last200 = ema200[ema200.length - 1];
                const prev9 = ema9[ema9.length - 2];
                const prev21 = ema21[ema21.length - 2];
                return {
                    ema9: last9, ema21: last21, ema50: last50, ema200: last200,
                    currentPrice: prices[prices.length - 1],
                    shortTermTrend: last9 > last21 ? 'Bullish' : 'Bearish',
                    mediumTermTrend: last21 > last50 ? 'Bullish' : 'Bearish',
                    longTermTrend: last50 > last200 ? 'Bullish' : 'Bearish',
                    justCrossedUp: prev9 <= prev21 && last9 > last21,
                    justCrossedDown: prev9 >= prev21 && last9 < last21,
                    ema9_21: ema9, ema21_21: ema21, ema50_21: ema50, ema200_21: ema200
                };
            },
            interpretRSI(rsiValue) {
                if (rsiValue < 20) return { signal: 'STRONG BUY', color: '#22c55e', text: 'Extremely Oversold', strength: 95 };
                if (rsiValue < 30) return { signal: 'BUY', color: '#4ade80', text: 'Oversold — Buying opportunity', strength: 75 };
                if (rsiValue < 45) return { signal: 'WEAK BUY', color: '#a3e635', text: 'Approaching oversold', strength: 55 };
                if (rsiValue < 55) return { signal: 'NEUTRAL', color: '#eab308', text: 'Neutral zone', strength: 50 };
                if (rsiValue < 70) return { signal: 'WEAK SELL', color: '#f97316', text: 'Approaching overbought', strength: 45 };
                if (rsiValue < 80) return { signal: 'SELL', color: '#ef4444', text: 'Overbought — Correction likely', strength: 25 };
                return { signal: 'STRONG SELL', color: '#dc2626', text: 'Extremely Overbought', strength: 5 };
            },
            getOverallSentiment(emaData, rsiValue, macdData) {
                let score = 40;
                if (emaData.shortTermTrend === 'Bullish') score += 15; else score -= 15;
                if (emaData.mediumTermTrend === 'Bullish') score += 10; else score -= 10;
                if (emaData.longTermTrend === 'Bullish') score += 5; else score -= 5;
                if (emaData.justCrossedUp) score += 15;
                if (emaData.justCrossedDown) score -= 15;
                if (rsiValue < 30) score += 15; else if (rsiValue > 70) score -= 15;
                const lastMACD = macdData.macdLine[macdData.macdLine.length - 1];
                const lastSignal = macdData.signalLine[macdData.signalLine.length - 1];
                if (lastMACD > lastSignal) score += 10; else score -= 10;
                const clamped = Math.max(5, Math.min(95, score));
                let s, c, e, d;
                if (clamped >= 75) { s = 'BULLISH'; c = '#22c55e'; e = '🟢'; d = 'Strong bullish signals. Technical indicators suggest upward momentum.'; }
                else if (clamped >= 55) { s = 'MODERATELY BULLISH'; c = '#4ade80'; e = '🟡'; d = 'Most indicators positive. Favoring buyers.'; }
                else if (clamped >= 45) { s = 'NEUTRAL'; c = '#eab308'; e = '⚪'; d = 'Mixed signals. Wait for confirmation.'; }
                else if (clamped >= 25) { s = 'MODERATELY BEARISH'; c = '#f97316'; e = '🟠'; d = 'Multiple weak signals. Consider reducing exposure.'; }
                else { s = 'BEARISH'; c = '#ef4444'; e = '🔴'; d = 'Strong bearish signals. Downward pressure likely.'; }
                return { score: clamped, sentiment: s, color: c, emoji: e, description: d };
            },
            generatePriceData(basePrice, days = 250) {
                const prices = [];
                let price = basePrice * 0.75 + (Math.random() * basePrice * 0.1);
                const volatility = basePrice * 0.018;
                for (let i = 0; i < days; i++) {
                    price += (Math.random() - 0.47) * volatility;
                    price = Math.max(price, basePrice * 0.55);
                    price = Math.min(price, basePrice * 1.5);
                    prices.push(parseFloat(price.toFixed(2)));
                }
                return prices;
            }
        };

        function generateNews(symbol, name) {
            const company = name.split(' ')[0];
            const templates = [
                {t:'Results',c:'positive',text:`${company} reports strong quarterly results — revenue up 12% YoY`},
                {t:'Dividend',c:'positive',text:`${company} declares interim dividend of ₹${(Math.random()*20+5).toFixed(1)} per share`},
                {t:'Analyst',c:'positive',text:`Brokerage upgrades ${symbol} to BUY with target ₹${(Math.random()*5000+500).toFixed(0)}`},
                {t:'Corporate',c:'neutral',text:`${company} announces ₹${(Math.random()*5000+500).toFixed(0)} Cr expansion plan`},
                {t:'Technical',c:'neutral',text:`${symbol} shows EMA crossover on daily charts`},
                {t:'Market',c:'negative',text:`Sector faces headwinds — ${company} may see short-term pressure`},
                {t:'Dividend',c:'positive',text:`${company} fixes record date for upcoming dividend`},
                {t:'Technical',c:'positive',text:`RSI indicates oversold levels — potential bounce expected`},
            ];
            const news = [];
            for(let i=0;i<6;i++){const t=templates[Math.floor(Math.random()*templates.length)];const h=Math.floor(Math.random()*48);news.push({...t,time:h<1?'Just now':h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`});}
            return news.sort((a,b)=>a.time.localeCompare(b.time));
        }
