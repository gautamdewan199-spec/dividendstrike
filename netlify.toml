# ============================================
# NETLIFY CONFIGURATION FOR DIVIDENDSTRIKE.IN
# ============================================

[build]
  publish = "."

# ============================================
# REDIRECTS — Specific rules FIRST, then fallback
# ============================================

# Static files — serve as-is (DO NOT redirect)
[[redirects]]
  from = "/*.ico"
  to = "/:splat.ico"
  status = 200

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200

[[redirects]]
  from = "/*.jpg"
  to = "/:splat.jpg"
  status = 200

[[redirects]]
  from = "/*.jpeg"
  to = "/:splat.jpeg"
  status = 200

[[redirects]]
  from = "/*.gif"
  to = "/:splat.gif"
  status = 200

[[redirects]]
  from = "/*.svg"
  to = "/:splat.svg"
  status = 200

[[redirects]]
  from = "/*.txt"
  to = "/:splat.txt"
  status = 200

[[redirects]]
  from = "/*.xml"
  to = "/:splat.xml"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.json"
  to = "/:splat.json"
  status = 200

[[redirects]]
  from = "/*.webmanifest"
  to = "/:splat.webmanifest"
  status = 200

# Sitemap — serve as-is
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Robots.txt — serve as-is
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback — ALL other routes go to index.html
# This MUST be the last rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
