        window.addEventListener('scroll',handleScroll,{passive:true});

        // Supabase
        const SUPABASE_URL = 'https://oezmykupzqjfuklxvxzi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lem15a3VwenFqZnVrbHh2eHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTQ3MjgsImV4cCI6MjA5MzM5MDcyOH0.XM82bC4_DKRZ3s6N-zKlqCVxZkM95fcfHL2ddxj28SE';

        // Sample blog posts (always shown as fallback)
        const SAMPLE_POSTS = [
            {
                id: 'sample-1', slug: 'highest-dividend-yield-stocks-nse-2026',
                title: 'Highest Dividend Paying Stocks NSE 2026 — Top 15 with AI Analysis',
                excerpt: 'Discover the highest dividend paying stocks in India for 2026. Our AI ranks top NSE dividend stocks by yield, sustainability, and growth potential.',
                category: 'Stock Lists', author: 'DividendStrike Research', published: true,
                read_time: '8 min read', created_at: '2026-05-15',
                content: `<h2>Finding the Best Dividend Stocks in India</h2>
                <p>Looking for <strong>highest dividend paying stocks in India for 2026</strong>? Our AI-powered platform analyzes 17 financial signals to rank the best dividend stocks on NSE.</p>
                <h2>Top 5 Highest Yield NSE Stocks</h2>
                <table><thead><tr><th>Stock</th><th>Yield</th><th>AI Score</th></tr></thead><tbody>
                <tr><td>Hindustan Zinc</td><td>17.86%</td><td>45/100 ⚠️</td></tr>
                <tr><td>Vedanta Ltd</td><td>12.53%</td><td>40/100 ⚠️</td></tr>
                <tr style="background:rgba(34,197,94,0.05);"><td><strong>Coal India</strong></td><td><strong>7.85%</strong></td><td><strong>92/100 ✅</strong></td></tr>
                <tr><td>ONGC</td><td>5.23%</td><td>79/100</td></tr>
                <tr><td>Power Grid Corp</td><td>4.39%</td><td>82/100</td></tr></tbody></table>
                <p>Use our <a href="screener.html" style="color:#22c55e;">AI Stock Screener</a> to find more dividend stocks.</p>`
            },
            {
                id: 'sample-2', slug: 'how-to-reinvest-dividends-india-drip-guide-2026',
                title: 'How to Reinvest Dividends in India 2026 — Complete DRIP Guide',
                excerpt: 'Learn how Dividend Reinvestment (DRIP) works in India. Step-by-step guide to manually reinvest dividends and compound your wealth.',
                category: 'Strategy', author: 'DividendStrike Research', published: true,
                read_time: '7 min read', created_at: '2026-05-10',
                content: `<h2>What is DRIP?</h2>
                <p><strong>DRIP (Dividend Reinvestment Plan)</strong> means using dividends to buy more shares instead of taking cash. India has NO formal DRIP — you must reinvest manually.</p>

                <p>Use our <a href="calculators.html" style="color:#22c55e;">DRIP Calculator</a> to project your returns.</p>`
            },
            {
                id: 'sample-3', slug: 'monthly-dividend-income-india-strategy',
                title: 'How to Build ₹50,000 Monthly Dividend Income in India',
                excerpt: 'Complete strategy guide to generate monthly passive income from NSE dividend stocks with portfolio allocation and tax planning.',
                category: 'Strategy', author: 'DividendStrike Research', published: true,
                read_time: '10 min read', created_at: '2026-05-05',
                content: `<h2>Building Monthly Dividend Income</h2>
                <p>At 5% average yield, you need approximately <strong>₹1.2 Crore</strong> to generate ₹50,000 monthly dividend income.</p>
                <h2>Sample Portfolio</h2>

                <p>Use our <a href="screener.html" style="color:#22c55e;">AI Screener</a> to build your portfolio.</p>`
            }
        ];

        async function getBlogPosts() {
            // 1. Try localStorage first (admin panel saves here)
            try {
                const stored = localStorage.getItem('dividendstrike_blog_posts');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    const published = parsed.filter(p => p.published);
                    if (published.length > 0) {
                        console.log('✅ Loaded', published.length, 'posts from localStorage');
                        return published;
                    }
                }
            } catch(e) {}
            
            // 2. Try Supabase
            try {
                const { data, error } = await supabase.from('blog_posts').select('*').eq('published', true).order('created_at', { ascending: false });
                if (!error && data && data.length > 0) {
                    console.log('✅ Loaded', data.length, 'posts from Supabase');
                    return data;
                }
            } catch(e) { console.log('Supabase not connected'); }
            
            // 3. Show sample posts
            console.log('ℹ️ Showing sample posts');
            return SAMPLE_POSTS;
        }

        function renderBlog() {
            const container = document.getElementById('blogContainer');
            container.innerHTML = '<p style="text-align:center;padding:40px;color:#9ca3af;">Loading posts...</p>';
            
            getBlogPosts().then(posts => {
                if (posts.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:60px;"><span style="font-size:60px;">📝</span><h1 style="font-size:24px;font-weight:900;">No Articles Yet</h1><p style="color:#9ca3af;">Check back soon!</p><a href="index.html" class="btn btn-primary" style="margin-top:16px;">🏠 Home</a></div>`;
                    return;
                }
                
                const featured = posts[0];
                const remaining = posts.slice(1);
                
                container.innerHTML = `
                <div style="margin-bottom:32px;"><h1 style="font-size:30px;font-weight:900;">📝 Dividend Investing Blog</h1><p style="color:#9ca3af;">${posts.length} articles</p></div>
                
                <div class="card card-clickable" style="padding:32px;margin-bottom:32px;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(16,185,129,0.04));" onclick="openPost('${featured.slug}')">
                    <span class="badge-yellow">⭐ Featured</span>
                    <span class="badge-green" style="margin-left:8px;">${featured.category||'Guide'}</span>
                    <h2 style="font-size:26px;font-weight:900;margin:12px 0;">${featured.title}</h2>
                    <p style="color:#9ca3af;">${featured.excerpt||''}</p>
                </div>
                
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;">
                    ${remaining.map(post => `
                    <div class="card card-clickable" style="padding:24px;" onclick="openPost('${post.slug}')">
                        <span class="badge-green">${post.category||'Guide'}</span>
                        <h3 style="font-size:17px;font-weight:700;margin:10px 0;">${post.title}</h3>
                        <p style="color:#9ca3af;font-size:13px;">${post.excerpt||post.content.replace(/<[^>]*>/g,'').substring(0,100)+'...'}</p>
                    </div>`).join('')}
                </div>`;
            });
        }

        function openPost(slug) {
            getBlogPosts().then(posts => {
                const post = posts.find(p => p.slug === slug);
                if (!post) return;
                
                const container = document.getElementById('blogContainer');
                container.innerHTML = `
                <div style="max-width:850px;margin:0 auto;">
                    <button onclick="renderBlog()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:14px;margin-bottom:24px;">← Back to All Articles</button>
                    <div class="card" style="padding:32px 40px;margin-bottom:24px;">
                        <span class="badge-green">${post.category||'General'}</span>
                        <h1 style="font-size:28px;font-weight:900;margin:12px 0;">${post.title}</h1>
                        <div style="font-size:12px;color:#6b7280;">✍️ ${post.author||'DividendStrike'} | 📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
                    </div>
                    <div class="card" style="padding:32px 40px;">
                        <div style="line-height:1.9;color:#d1d5db;font-size:16px;">${post.content}</div>
                    </div>
                </div>`;
                window.scrollTo({top:0,behavior:'smooth'});
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            handleScroll();
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (slug) {
                openPost(slug);
            } else {
                renderBlog();
            }
            console.log('📝 Blog ready');
        });
    </script>
