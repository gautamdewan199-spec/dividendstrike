    <script>
       // Navigation
function toggleMenu(){var m=document.getElementById('mobileMenu');m.style.display=m.style.display==='none'?'grid':'none';}
document.addEventListener('click',function(e){var m=document.getElementById('mobileMenu');var b=document.querySelector('.mobile-menu-btn');if(m&&b&&!m.contains(e.target)&&!b.contains(e.target))m.style.display='none';});
function handleScroll(){var b=document.getElementById('scrollToTopBtn');if(b)b.classList.toggle('show',window.scrollY>400);}
window.addEventListener('scroll',handleScroll,{passive:true});
handleScroll();

// ============================================
// SIMPLE BLOG - GUARANTEED TO WORK
// ============================================

// Get posts from localStorage
function getPosts() {
    try {
        var data = localStorage.getItem('dividendstrike_blog_posts');
        return data ? JSON.parse(data) : [];
    } catch(e) { return []; }
}

// Check if admin saved posts with different key
function findPosts() {
    // Try the main key first
    var posts = getPosts();
    if (posts.length > 0) return posts;
    
    // Try alternative keys
    var keys = ['ds_posts', 'blogPosts', 'dividendstrike_posts', 'blog_posts'];
    for (var i = 0; i < keys.length; i++) {
        try {
            var data = localStorage.getItem(keys[i]);
            if (data) {
                var parsed = JSON.parse(data);
                if (parsed.length > 0) {
                    console.log('Found posts under key:', keys[i]);
                    return parsed;
                }
            }
        } catch(e) {}
    }
    return [];
}

// Main render function
function showBlog() {
    var allPosts = findPosts();
    var posts = [];
    
    // Filter published posts
    for (var i = 0; i < allPosts.length; i++) {
        if (allPosts[i].published) {
            posts.push(allPosts[i]);
        }
    }
    
    // Sort by date (newest first)
    posts.sort(function(a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
    });
    
    var container = document.getElementById('blogContainer');
    if (!container) return;
    
    // Check URL for single post
    var urlParams = new URLSearchParams(window.location.search);
    var slug = urlParams.get('slug');
    
    if (slug) {
        for (var i = 0; i < posts.length; i++) {
            if (posts[i].slug === slug) {
                showSinglePost(posts[i], posts);
                return;
            }
        }
    }
    
    // Show blog listing
    if (posts.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:64px;margin-bottom:20px;">📝</div><h1 style="font-size:28px;font-weight:900;margin-bottom:12px;">No Articles Yet</h1><p style="color:#9ca3af;font-size:15px;margin-bottom:8px;">Blog posts published from the admin panel will appear here.</p><p style="color:#6b7280;font-size:13px;">Create your first post in the <a href="admin.html" style="color:#22c55e;">Admin Panel</a></p><a href="index.html" style="display:inline-block;margin-top:24px;padding:12px 28px;background:#22c55e;color:white;border-radius:10px;text-decoration:none;font-weight:600;">🏠 Back to Home</a></div>';
        console.log('No published posts found. Total posts in storage:', allPosts.length);
        return;
    }
    
    console.log('Rendering', posts.length, 'published posts');
    
    var html = '';
    html += '<div style="margin-bottom:32px;">';
    html += '<h1 style="font-size:30px;font-weight:900;margin-bottom:6px;">📝 Dividend Investing Blog</h1>';
    html += '<p style="color:#9ca3af;font-size:14px;">Expert guides, stock analysis, and dividend strategies — ' + posts.length + ' article' + (posts.length > 1 ? 's' : '') + '</p>';
    html += '</div>';
    
    // Featured post (first one)
    var featured = posts[0];
    html += '<div class="card card-clickable" style="padding:32px;margin-bottom:32px;cursor:pointer;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(16,185,129,0.04));" onclick="showSinglePost(findPosts().find(function(p){return p.slug===\'' + featured.slug + '\'}), findPosts().filter(function(p){return p.published;}))">';
    html += '<span class="badge-yellow" style="margin-right:8px;">⭐ Featured</span>';
    html += '<span class="badge-green">' + (featured.category || 'Guide') + '</span>';
    html += '<h2 style="font-size:26px;font-weight:900;margin:14px 0;">' + featured.title + '</h2>';
    html += '<p style="color:#9ca3af;font-size:14px;">' + (featured.excerpt || '') + '</p>';
    html += '<div style="font-size:12px;color:#6b7280;margin-top:12px;">📅 ' + new Date(featured.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + '</div>';
    html += '</div>';
    
    // Rest of posts grid
    var remaining = posts.slice(1);
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;">';
    
    for (var i = 0; i < remaining.length; i++) {
        var post = remaining[i];
        var colors = ['#22c55e,#16a34a', '#3b82f6,#8b5cf6', '#f59e0b,#ef4444'];
        var color = colors[i % 3];
        html += '<div class="card card-clickable" style="padding:24px;cursor:pointer;" onclick="showSinglePost(findPosts().find(function(p){return p.slug===\'' + post.slug + '\'}), findPosts().filter(function(p){return p.published;}))">';
        html += '<div style="height:4px;background:linear-gradient(90deg,' + color + ');border-radius:2px;margin-bottom:16px;width:' + (40 + (i * 8)) + '%;"></div>';
        html += '<span class="badge-green" style="margin-bottom:10px;">' + (post.category || 'Guide') + '</span>';
        html += '<h3 style="font-size:17px;font-weight:700;margin:8px 0;line-height:1.4;">' + post.title + '</h3>';
        html += '<p style="color:#9ca3af;font-size:13px;line-height:1.5;">' + (post.excerpt || '') + '</p>';
        html += '<div style="font-size:11px;color:#6b7280;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.04);">📅 ' + new Date(post.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + '</div>';
        html += '</div>';
    }
    html += '</div>';
    
    container.innerHTML = html;
}

// Show single blog post
function showSinglePost(post, allPosts) {
    var container = document.getElementById('blogContainer');
    if (!container || !post) return;
    
    // Update URL
    if (window.history && window.history.pushState) {
        window.history.pushState(null, '', '?slug=' + post.slug);
    }
    
    var html = '<div style="max-width:850px;margin:0 auto;">';
    html += '<a href="blog.html" style="color:#9ca3af;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:24px;">← Back to All Articles</a>';
    
    // Post header
    html += '<div class="card" style="padding:32px;margin-bottom:24px;background:linear-gradient(135deg,rgba(15,15,25,0.9),rgba(10,10,20,0.9));">';
    html += '<span class="badge-green" style="margin-bottom:12px;">' + (post.category || 'General') + '</span>';
    html += '<h1 style="font-size:28px;font-weight:900;margin:12px 0;line-height:1.3;">' + post.title + '</h1>';
    if (post.excerpt) html += '<p style="color:#9ca3af;font-size:15px;">' + post.excerpt + '</p>';
    html += '<div style="font-size:12px;color:#6b7280;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">';
    html += '✍️ ' + (post.author || 'DividendStrike Research') + ' | ';
    html += '📅 ' + new Date(post.created_at).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + ' | ';
    html += '⏱️ ' + (post.read_time || '8 min read');
    html += '</div></div>';
    
    // Post content
    html += '<div class="card" style="padding:32px;">';
    html += '<div style="line-height:1.9;color:#d1d5db;font-size:16px;">' + (post.content || '<p>No content available.</p>') + '</div>';
    html += '</div>';
    
    // Related posts
    if (allPosts && allPosts.length > 1) {
        var related = [];
        for (var i = 0; i < allPosts.length; i++) {
            if (allPosts[i].slug !== post.slug) related.push(allPosts[i]);
        }
        related = related.slice(0, 3);
        
        if (related.length > 0) {
            html += '<div style="margin-top:24px;"><h3 style="font-size:18px;font-weight:700;margin-bottom:16px;">📚 Related Articles</h3>';
            html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;">';
            for (var i = 0; i < related.length; i++) {
                html += '<div class="card card-clickable" style="padding:20px;cursor:pointer;" onclick="showSinglePost(findPosts().find(function(p){return p.slug===\'' + related[i].slug + '\'}), findPosts().filter(function(p){return p.published;}))">';
                html += '<span class="badge-green">' + (related[i].category || 'Guide') + '</span>';
                html += '<h4 style="font-size:15px;font-weight:700;margin:8px 0;">' + related[i].title + '</h4>';
                html += '</div>';
            }
            html += '</div></div>';
        }
    }
    
    html += '</div>';
    container.innerHTML = html;
    window.scrollTo({top:0,behavior:'smooth'});
}

// Run on page load
showBlog();

// Debug info
console.log('📝 Blog page loaded');
console.log('📊 Checking localStorage for posts...');
var allPosts = findPosts();
console.log('Total posts in storage:', allPosts.length);
console.log('Published posts:', allPosts.filter(function(p){return p.published;}).length);
if (allPosts.length > 0) {
    console.log('Posts found:');
    allPosts.forEach(function(p, i) {
        console.log('  ' + (i+1) + '.', p.title, '(Published:', p.published, ')');
    });
} else {
    console.log('❌ No posts found in localStorage');
    console.log('💡 Make sure your admin panel saves with key: dividendstrike_blog_posts');
}
    </script>
