        :root{--bg:#0a0a0f;--text:#e5e7eb;--text-secondary:#9ca3af;--text-muted:#6b7280}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .container{max-width:1100px;margin:0 auto;padding:0 20px}
        .navbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);background:rgba(10,10,15,0.95);border-bottom:1px solid rgba(255,255,255,0.06);padding:10px 0}
        .navbar .container{display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:17px}
        .logo-name{font-size:17px;font-weight:900;color:#e5e7eb}.logo-name span{color:#22c55e}
        .nav-links{display:flex;gap:2px}.nav-links a{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;color:#9ca3af}
        .nav-links a:hover{color:white;background:rgba(255,255,255,0.04)}.nav-links a.active{background:rgba(34,197,94,0.12);color:#22c55e}
        .text-center{text-align:center}.text-green{color:#22c55e}.text-muted{color:#6b7280}.text-secondary{color:#9ca3af}
        .card{background:rgba(15,15,25,0.85);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:24px;margin-bottom:16px;transition:all 0.3s ease}
        .card-clickable{cursor:pointer}.card-clickable:hover{border-color:rgba(34,197,94,0.35);transform:translateY(-2px)}
        .btn{display:inline-block;padding:10px 20px;background:#22c55e;color:white;border-radius:10px;text-decoration:none;font-weight:600;border:none;cursor:pointer;font-size:14px}
        .btn:hover{background:#16a34a}
        .badge-green{background:rgba(34,197,94,0.2);color:#22c55e;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
        .badge-yellow{background:rgba(234,179,8,0.2);color:#eab308;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
        .footer{border-top:1px solid rgba(255,255,255,0.06);padding:24px 0;margin-top:40px;text-align:center;font-size:12px;color:#4b5563}
        .footer a{color:#6b7280;margin:0 8px;text-decoration:none}
        .blog-content{line-height:1.9;color:#d1d5db;font-size:16px}
        .blog-content h2{font-size:24px;font-weight:800;color:#f3f4f6;margin:32px 0 16px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px}
        .blog-content table{width:100%;border-collapse:collapse;margin:20px 0}
        .blog-content th{background:rgba(34,197,94,0.1);color:#22c55e;padding:14px 18px;text-align:left;border-bottom:2px solid rgba(34,197,94,0.3);font-weight:700;font-size:13px}
        .blog-content td{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.04);color:#d1d5db;font-size:14px}
        
        /* Scroll to Top Button */
        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.25);
            color: #22c55e;
            font-size: 22px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
        }
        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        #scrollTopBtn:hover {
            background: rgba(34,197,94,0.25);
            border-color: rgba(34,197,94,0.5);
            transform: translateY(-2px);
        }
        
        @media(max-width:768px){
            .nav-links{display:none}
            #scrollTopBtn {
                bottom: 20px;
                right: 20px;
                width: 42px;
                height: 42px;
                font-size: 18px;
                border-radius: 12px;
            }
        }

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================
    // SUPABASE CONFIG
    // ============================================
    var SUPABASE_URL = 'https://oezmykupzqjfuklxvxzi.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lem15a3VwenFqZnVrbHh2eHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTQ3MjgsImV4cCI6MjA5MzM5MDcyOH0.XM82bC4_DKRZ3s6N-zKlqCVxZkM95fcfHL2ddxj28SE';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================
    // SCROLL TO TOP BUTTON
    // ============================================
    window.addEventListener('scroll', function() {
        var btn = document.getElementById('scrollTopBtn');
        if (btn) {
            if (window.scrollY > 400) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        }
    });

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================
    // GET POSTS - Supabase first, localStorage backup
    // ============================================
   async function getPosts() {
    // Try Supabase with timeout
    try {
        var result = await supabase
            .from('blog_posts')
            .select('*')
            .eq('published', true)
            .order('created_at', { ascending: false });
        
        if (!result.error && result.data && result.data.length > 0) {
            // Cache for next time
            localStorage.setItem('dividendstrike_blog_cache', JSON.stringify(result.data));
            console.log('✅ Loaded ' + result.data.length + ' posts from Supabase');
            return result.data;
        }
    } catch(e) {
        console.log('⚠️ Supabase fetch failed, trying cache...');
    }
    
    // Fallback to cache
    try {
        var cached = localStorage.getItem('dividendstrike_blog_cache');
        if (cached) {
            var posts = JSON.parse(cached);
            if (posts.length > 0) {
                console.log('📦 Loaded ' + posts.length + ' posts from cache');
                return posts;
            }
        }
    } catch(e) {}
    
    // Last resort: localStorage old key
    try {
        var oldData = localStorage.getItem('dividendstrike_blog_posts');
        if (oldData) {
            console.log('📦 Loaded from old localStorage');
            return JSON.parse(oldData);
        }
    } catch(e) {}
    
    console.log('ℹ️ No posts found');
    return [];
}
   
    // ============================================
    // SHOW BLOG LISTING
    // ============================================
    async function showBlog() {
        var container = document.getElementById('blogContainer');
        container.innerHTML = '<p style="text-align:center;padding:40px;color:#9ca3af;">Loading posts...</p>';
        
        var allPosts = await getPosts();
        var posts = allPosts.filter(function(p) { return p.published; });
        posts.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
        
        // Check URL for single post via slug
        var slug = new URLSearchParams(window.location.search).get('slug');
        if (slug) {
            var post = posts.find(function(p) { return p.slug === slug; });
            if (post) { showSingle(post, posts); return; }
        }
        
        // No posts
        if (posts.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:64px;margin-bottom:16px;">📝</div><h1 style="font-size:28px;font-weight:900;margin-bottom:8px;">Blog Coming Soon</h1><p style="color:#9ca3af;font-size:14px;">Our research team is preparing comprehensive dividend investing guides.</p><p style="color:#6b7280;font-size:12px;margin-top:8px;">Check back soon or <a href="screener.html" style="color:#22c55e;">use our AI Screener</a> in the meantime.</p><a href="index.html" class="btn" style="margin-top:20px;">🏠 Back to Home</a></div>';
            return;
        }
        
        console.log('📝 Showing ' + posts.length + ' published posts');
        
        var html = '<div style="margin-bottom:28px;"><h1 style="font-size:28px;font-weight:900;">📝 Dividend Investing Blog</h1><p style="color:#9ca3af;">Expert guides, stock analysis, and dividend strategies for Indian investors</p></div>';
        
        // Featured post
        var featured = posts[0];
        html += '<div class="card card-clickable" style="padding:28px;margin-bottom:24px;background:linear-gradient(135deg,rgba(34,197,94,0.06),rgba(16,185,129,0.03));" onclick="location.href=\'?slug=' + featured.slug + '\'">';
        html += '<span class="badge-yellow">⭐ Featured</span> <span class="badge-green">' + (featured.category || 'Guide') + '</span>';
        html += '<h2 style="font-size:22px;font-weight:900;margin:10px 0;">' + featured.title + '</h2>';
        html += '<p style="color:#9ca3af;">' + (featured.excerpt || '') + '</p>';
        html += '<div style="font-size:11px;color:#6b7280;margin-top:12px;">📅 ' + new Date(featured.created_at).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}) + '</div>';
        html += '</div>';
        
        // Rest of posts
        var rest = posts.slice(1);
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">';
        rest.forEach(function(post) {
            html += '<div class="card card-clickable" style="padding:20px;" onclick="location.href=\'?slug=' + post.slug + '\'">';
            html += '<span class="badge-green">' + (post.category || 'Guide') + '</span>';
            html += '<h3 style="font-size:16px;font-weight:700;margin:8px 0;">' + post.title + '</h3>';
            html += '<p style="color:#9ca3af;font-size:12px;">' + (post.excerpt || '') + '</p>';
            html += '</div>';
        });
        html += '</div>';
        
        container.innerHTML = html;
    }

    // ============================================
    // SHOW SINGLE POST
    // ============================================
    function showSingle(post, allPosts) {
        var container = document.getElementById('blogContainer');
        var related = allPosts.filter(function(p) { return p.slug !== post.slug; }).slice(0, 3);
        
        // Set dynamic title tag
        document.title = (post.title_tag || post.title) + ' | DividendStrike';
        
        // Set dynamic meta description
        var metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc && post.meta_description) {
            metaDesc.setAttribute('content', post.meta_description);
        } else if (metaDesc && post.excerpt) {
            metaDesc.setAttribute('content', post.excerpt);
        }
        
        var html = '<div style="max-width:800px;margin:0 auto;">';
        html += '<a href="blog.html" style="color:#9ca3af;text-decoration:none;font-size:14px;">← Back to Blog</a>';
        html += '<div class="card" style="padding:28px;margin-top:20px;">';
        html += '<span class="badge-green">' + (post.category || 'General') + '</span>';
        html += '<h1 style="font-size:26px;font-weight:900;margin:12px 0;">' + post.title + '</h1>';
        if (post.excerpt) html += '<p style="color:#9ca3af;">' + post.excerpt + '</p>';
        html += '<div style="font-size:11px;color:#6b7280;margin-top:12px;">✍️ ' + (post.author || 'DividendStrike') + ' | 📅 ' + new Date(post.created_at).toLocaleDateString('en-IN', {day: 'numeric', month: 'long', year: 'numeric'}) + '</div>';
        html += '</div>';
        html += '<div class="card" style="padding:28px;margin-top:16px;"><div class="blog-content">' + (post.content || '') + '</div></div>';
        
        if (related.length > 0) {
            html += '<div style="margin-top:24px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">📚 Related</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">';
            related.forEach(function(r) {
                html += '<div class="card card-clickable" style="padding:16px;" onclick="location.href=\'?slug=' + r.slug + '\'"><span class="badge-green" style="font-size:10px;">' + (r.category || 'Guide') + '</span><h4 style="font-size:14px;font-weight:700;margin:6px 0;">' + r.title + '</h4></div>';
            });
            html += '</div></div>';
        }
        html += '</div>';
        
        container.innerHTML = html;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // ============================================
    // INITIALIZE
    // ============================================
    showBlog();
    console.log('✅ Blog ready — Supabase + localStorage');
</script>
