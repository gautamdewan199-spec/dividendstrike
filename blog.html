<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividend Investing Blog — Expert Guides, Stock Analysis & Strategy | DividendStrike</title>
    <meta name="description" content="Expert dividend investing guides for Indian investors. AI-powered stock analysis, DRIP strategies, tax planning, PSU dividend insights, and monthly income strategies.">
    <meta name="keywords" content="dividend investing blog india, dividend stock analysis, nse dividend guide, monthly income stocks, drip strategy india, psu dividend stocks, dividend tax guide, best dividend shares, passive income india blog">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://dividendstrike.in/blog.html">
    
    <meta property="og:title" content="Dividend Investing Blog — Expert Guides & Stock Analysis | DividendStrike">
    <meta property="og:description" content="Expert dividend investing guides for Indian investors. AI-powered stock analysis and strategies.">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F67MPYPHJ3"></script>

    <style>
        :root{--bg:#0a0a0f;--card:rgba(15,15,25,0.85);--border:rgba(255,255,255,0.07);--text:#e5e7eb;--text-secondary:#9ca3af;--text-muted:#6b7280}
        *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#1f2937 transparent}
        *::-webkit-scrollbar{width:4px;height:4px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:#1f2937;border-radius:2px}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .container{max-width:1200px;margin:0 auto;padding:0 20px}
        
        /* NAV */
        .navbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);background:rgba(10,10,15,0.95);border-bottom:1px solid rgba(255,255,255,0.06)}
        .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:17px}
        .logo-text{line-height:1}.logo-name{font-size:17px;font-weight:900;color:#e5e7eb}.logo-tagline{font-size:8px;color:#6b7280;display:block;text-transform:uppercase;letter-spacing:1px}
        .nav-links{display:flex;gap:2px}.nav-link{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;color:#9ca3af;transition:all 0.2s}
        .nav-link:hover{color:white;background:rgba(255,255,255,0.04)}.nav-link.active{background:rgba(34,197,94,0.12);color:#22c55e}
        .nav-actions{display:flex;align-items:center;gap:14px}
        .pulse-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        .mobile-menu-btn{display:none;background:none;border:none;color:white;font-size:22px;cursor:pointer;padding:8px 12px;border-radius:8px}
        .mobile-menu{display:none;padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(10,10,15,0.98);grid-template-columns:1fr 1fr;gap:4px}
        .mobile-menu a{display:block;padding:12px 14px;border-radius:10px;font-size:13px;text-decoration:none;color:#9ca3af}.mobile-menu a.active{color:#22c55e;background:rgba(34,197,94,0.1);font-weight:600}
        
        .text-green{color:#22c55e}.text-blue{color:#3b82f6}.text-yellow{color:#eab308}.text-red{color:#ef4444}.text-purple{color:#a855f7}.text-muted{color:#6b7280}.text-secondary{color:#9ca3af}
        .text-xs{font-size:12px}.text-sm{font-size:14px}.text-lg{font-size:18px}.text-xl{font-size:20px}.text-2xl{font-size:24px}.text-3xl{font-size:30px}.font-bold{font-weight:700}.font-black{font-weight:900}.text-center{text-align:center}
        
        .card{background:rgba(15,15,25,0.85);border:1px solid rgba(255,255,255,0.07);border-radius:16px;transition:all 0.3s ease}
        .card-clickable{cursor:pointer}.card-clickable:hover{border-color:rgba(34,197,94,0.35);box-shadow:0 20px 50px -15px rgba(34,197,94,0.2);transform:translateY(-2px)}
        .btn{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;display:inline-block;text-decoration:none}
        .btn-primary{background:#22c55e;color:white}.btn-primary:hover{background:#16a34a}
        .btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.2);color:#9ca3af;text-decoration:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;display:inline-block;transition:all 0.2s}.btn-outline:hover{border-color:#22c55e;color:white}
        .btn-sm{padding:6px 14px;font-size:12px}
        .badge-green{background:rgba(34,197,94,0.2);color:#22c55e;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
        .badge-yellow{background:rgba(234,179,8,0.2);color:#eab308;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
        
        .footer-main{border-top:1px solid rgba(255,255,255,0.06);padding:24px 0;margin-top:40px;text-align:center;font-size:12px;color:#4b5563}
        .footer-main a{color:#6b7280;text-decoration:none;margin:0 8px}.footer-main a:hover{color:#22c55e}
        .scroll-top-btn{position:fixed;bottom:30px;right:30px;width:48px;height:48px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:16px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(34,197,94,0.3);transition:all 0.4s ease;opacity:0;visibility:hidden;color:white;font-size:20px;font-weight:700}
        .scroll-top-btn.show{opacity:1;visibility:visible}.scroll-top-btn:hover{transform:translateY(-4px)}
        
        @media(max-width:1024px){.nav-links{display:none!important}.mobile-menu-btn{display:block!important}}
        @media(max-width:768px){.blog-grid{grid-template-columns:1fr!important}}
        @media(max-width:500px){.scroll-top-btn{bottom:16px;right:16px;width:40px;height:40px;font-size:16px}}
        
        .blog-post-content{line-height:1.9;color:#d1d5db;font-size:16px}
        .blog-post-content h2{font-size:24px;font-weight:800;color:#f3f4f6;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08)}
        .blog-post-content h3{font-size:18px;font-weight:700;color:#e5e7eb;margin:24px 0 12px}
        .blog-post-content p{margin-bottom:16px;font-size:15px}
        .blog-post-content ul,.blog-post-content ol{padding-left:20px;margin-bottom:16px}
        .blog-post-content li{margin-bottom:8px;font-size:15px}
        .blog-post-content table{width:100%;border-collapse:collapse;margin:20px 0;border-radius:12px;overflow:hidden}
        .blog-post-content th{background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(16,185,129,0.1));color:#22c55e;padding:14px 18px;text-align:left;border-bottom:2px solid rgba(34,197,94,0.3);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.5px}
        .blog-post-content td{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.04);color:#d1d5db;font-size:14px}
        .blog-post-content strong{color:#22c55e}
        .blog-post-content a{color:#22c55e;font-weight:600;text-decoration:underline}
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="home.html" class="logo"><div class="logo-icon">₹</div><div class="logo-text"><span class="logo-name">Dividend<span class="text-green">Strike</span></span><span class="logo-tagline">NSE Dividend Intelligence</span></div></a>
            <div class="nav-links"><a href="home.html" class="nav-link">🏠 Home</a><a href="screener.html" class="nav-link">🔍 Screener</a><a href="calculators.html" class="nav-link">🧮 Calculators</a><a href="blog.html" class="nav-link active">📝 Blog</a><a href="knowledge-hub.html" class="nav-link">📚 Learn</a></div>
            <div class="nav-actions"><span class="live-indicator"><span class="pulse-dot"></span><span style="font-size:11px;color:#9ca3af;">Live NSE Data</span></span><button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button></div>
        </div>
        <div id="mobileMenu" class="mobile-menu" style="display:none;"><a href="home.html">🏠 Home</a><a href="screener.html">🔍 Screener</a><a href="calculators.html">🧮 Calculators</a><a href="blog.html" class="active">📝 Blog</a><a href="knowledge-hub.html">📚 Learn</a></div>
    </nav>

    <main id="blogContainer" class="container" style="padding:24px 0;">
        <div class="text-center" style="padding:60px 0;">
            <p style="color:#9ca3af;">Loading blog...</p>
        </div>
    </main>

    <footer class="footer-main"><div class="container"><p>DividendStrike — AI-Powered NSE Analysis</p><div style="margin-top:6px;"><a href="home.html">Home</a> <a href="screener.html">Screener</a> <a href="calculators.html">Calculators</a> <a href="blog.html">Blog</a> <a href="knowledge-hub.html">Learn</a></div></div></footer>
    <button id="scrollToTopBtn" class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <script>
        // Navigation
        function toggleMobileMenu(){const m=document.getElementById('mobileMenu');m.style.display=(m.style.display==='none'||m.style.display==='')?'grid':'none';}
        document.addEventListener('click',e=>{const m=document.getElementById('mobileMenu');const b=document.querySelector('.mobile-menu-btn');if(m&&b&&!m.contains(e.target)&&!b.contains(e.target))m.style.display='none';});
        function handleScrollButton(){const b=document.getElementById('scrollToTopBtn');if(b)b.classList.toggle('show',window.scrollY>400);}
        window.addEventListener('scroll',handleScrollButton,{passive:true});

        // Blog functions
        function getBlogPosts(){try{const p=localStorage.getItem('dividendstrike_blog_posts');return p?JSON.parse(p):[];}catch(e){return[];}}
        
        function renderBlog() {
            const allPosts = getBlogPosts();
            const posts = allPosts.filter(p => p.published).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const container = document.getElementById('blogContainer');
            
            if (posts.length === 0) {
                container.innerHTML = `
                <div style="text-align:center;padding:60px 0;">
                    <span style="font-size:60px;display:block;margin-bottom:16px;">📝</span>
                    <h1 style="font-size:24px;font-weight:900;margin-bottom:8px;">No Articles Published Yet</h1>
                    <p style="color:#9ca3af;font-size:14px;margin-bottom:24px;">Our research team is preparing comprehensive dividend investing guides. Check back soon!</p>
                    <a href="home.html" class="btn btn-primary">🏠 Back to Home</a>
                </div>`;
                return;
            }
            
            const featured = posts[0];
            const remaining = posts.slice(1);
            
            container.innerHTML = `
            <div style="margin-bottom:32px;">
                <h1 style="font-size:30px;font-weight:900;margin-bottom:6px;">📝 Dividend Investing Blog</h1>
                <p style="color:#9ca3af;font-size:14px;">Expert guides, stock analysis, and dividend strategies for Indian investors — ${posts.length} articles</p>
            </div>
            
            <!-- Featured Post -->
            <div class="card card-clickable" style="padding:32px;margin-bottom:32px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(16,185,129,0.04));" onclick="renderBlogPost('${featured.id}')">
                <div style="position:absolute;top:0;right:0;width:300px;height:300px;background:rgba(34,197,94,0.05);border-radius:50%;filter:blur(60px);"></div>
                <div style="position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:24px;align-items:center;">
                    <div style="flex:1;min-width:250px;">
                        <span class="badge-yellow" style="margin-bottom:12px;">⭐ Featured Article</span>
                        <span class="badge-green" style="margin-left:8px;margin-bottom:12px;">${featured.category||'Guide'}</span>
                        <h2 style="font-size:26px;font-weight:900;margin:12px 0;line-height:1.3;">${featured.title}</h2>
                        <p style="color:#9ca3af;font-size:14px;margin-bottom:16px;">${featured.excerpt || featured.content.replace(/<[^>]*>/g,'').substring(0,180)+'...'}</p>
                        <div style="display:flex;gap:16px;font-size:12px;color:#6b7280;">
                            <span>✍️ ${featured.author||'DividendStrike'}</span>
                            <span>📅 ${new Date(featured.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
                            <span>⏱️ ${featured.read_time||'8 min read'}</span>
                        </div>
                    </div>
                    <div style="text-align:center;font-size:60px;min-width:100px;">📊</div>
                </div>
            </div>
            
            <!-- Post Grid -->
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;">
                ${remaining.map((post, i) => `
                <div class="card card-clickable" style="padding:24px;" onclick="renderBlogPost('${post.id}')">
                    <div style="height:4px;background:linear-gradient(90deg,${i%3===0?'#22c55e,#16a34a':i%3===1?'#3b82f6,#8b5cf6':'#f59e0b,#ef4444'});border-radius:2px;margin-bottom:16px;width:${40+(i*10)}%;transition:width 0.3s;"></div>
                    <span class="badge-green" style="margin-bottom:10px;">${post.category||'Guide'}</span>
                    <h3 style="font-size:17px;font-weight:700;margin:10px 0;line-height:1.4;">${post.title}</h3>
                    <p style="color:#9ca3af;font-size:13px;margin-bottom:14px;line-height:1.5;">${post.excerpt || post.content.replace(/<[^>]*>/g,'').substring(0,100)+'...'}</p>
                    <div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7280;padding-top:12px;border-top:1px solid rgba(255,255,255,0.04);">
                        <span>✍️ ${post.author||'DividendStrike'}</span>
                        <span>📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>
                    </div>
                </div>
                `).join('')}
            </div>`;
        }
        
        function renderBlogPost(postId) {
            const posts = getBlogPosts();
            const post = posts.find(p => p.id === postId);
            const container = document.getElementById('blogContainer');
            
            if (!post) {
                container.innerHTML = `<div style="text-align:center;padding:60px;"><p style="color:#9ca3af;">Post not found</p><button onclick="renderBlog()" class="btn btn-primary" style="margin-top:16px;">← Back to Blog</button></div>`;
                return;
            }
            
            const related = posts.filter(p => p.id !== post.id && p.category === post.category && p.published).slice(0,3);
            const allRelated = related.length > 0 ? related : posts.filter(p => p.id !== post.id && p.published).slice(0,3);
            
            container.innerHTML = `
            <div style="max-width:850px;margin:0 auto;">
                <button onclick="renderBlog()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:14px;margin-bottom:24px;display:inline-block;padding:0;">← Back to All Articles</button>
                
                <div class="card" style="padding:32px 40px;margin-bottom:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(15,15,25,0.9),rgba(10,10,20,0.9));">
                    <div style="position:absolute;top:0;right:0;width:250px;height:250px;background:rgba(34,197,94,0.04);border-radius:50%;filter:blur(60px);"></div>
                    <div style="position:relative;z-index:1;">
                        <span class="badge-green" style="margin-bottom:12px;">${post.category||'General'}</span>
                        <h1 style="font-size:28px;font-weight:900;margin:12px 0;line-height:1.3;">${post.title}</h1>
                        ${post.excerpt?`<p style="color:#9ca3af;font-size:15px;margin-bottom:16px;">${post.excerpt}</p>`:''}
                        <div style="display:flex;gap:16px;font-size:12px;color:#6b7280;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">
                            <span>✍️ ${post.author||'DividendStrike Research'}</span>
                            <span>📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
                            <span>⏱️ ${post.read_time||'8 min read'}</span>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="padding:32px 40px;margin-bottom:24px;">
                    <div class="blog-post-content">${post.content}</div>
                    
                    ${post.keywords&&post.keywords.length>0?`
                    <div style="margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06);">
                        <p style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Related Topics</p>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;">${post.keywords.map(k=>`<span style="background:rgba(255,255,255,0.04);padding:6px 14px;border-radius:20px;font-size:11px;color:#9ca3af;">#${k.trim()}</span>`).join('')}</div>
                    </div>`:''}
                </div>
                
                ${allRelated.length>0?`
                <div style="margin-bottom:24px;">
                    <h3 style="font-size:18px;font-weight:700;margin-bottom:16px;">📚 Related Articles</h3>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;">
                        ${allRelated.map(r=>`
                        <div class="card card-clickable" style="padding:20px;" onclick="renderBlogPost('${r.id}')">
                            <span class="badge-green" style="margin-bottom:8px;">${r.category}</span>
                            <h4 style="font-size:15px;font-weight:700;line-height:1.4;">${r.title}</h4>
                        </div>`).join('')}
                    </div>
                </div>`:''}
                
                <div class="card" style="padding:28px;text-align:center;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(16,185,129,0.04));border:1px solid rgba(34,197,94,0.15);">
                    <span style="font-size:36px;display:block;margin-bottom:8px;">📬</span>
                    <h3 style="font-size:18px;font-weight:800;margin-bottom:6px;">Get Weekly Dividend Stock Alerts</h3>
                    <p style="color:#9ca3af;font-size:13px;margin-bottom:16px;">Join smart investors who receive our top dividend picks every Saturday.</p>
                    <div style="display:flex;gap:8px;max-width:400px;margin:0 auto;">
                        <input type="email" placeholder="your@email.com" style="flex:1;background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;color:white;font-size:14px;outline:none;font-family:inherit;">
                        <button class="btn btn-primary btn-sm" onclick="this.innerHTML='✅ Done!'">Subscribe</button>
                    </div>
                </div>
            </div>`;
            
            window.scrollTo({top:0,behavior:'smooth'});
        }
        
        // Check for post in URL
        function checkUrlForPost() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');
            if (postId) {
                renderBlogPost(postId);
            } else {
                renderBlog();
            }
        }
        
        document.addEventListener('DOMContentLoaded',()=>{
            handleScrollButton();
            checkUrlForPost();
            console.log('📝 Blog page loaded');
        });
    </script>
</body>
</html>
