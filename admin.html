<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DividendStrike — Blog Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card: #111118; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e5e7eb; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        input, textarea, select { width: 100%; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: white; font-size: 14px; outline: none; margin-bottom: 12px; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus, select:focus { border-color: #22c55e; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 4px; font-weight: 500; }
        .btn { padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .btn-green { background: #22c55e; color: white; } .btn-green:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; color: white; } .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; color: white; } .btn-red:hover { background: #dc2626; }
        .btn-gray { background: #374151; color: white; } .btn-gray:hover { background: #4b5563; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-pub { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-draft { background: rgba(234,179,8,0.2); color: #eab308; }
        .post-row { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 999; padding: 14px 20px; border-radius: 12px; font-size: 14px; color: white; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <div style="max-width: 1000px; margin: 0 auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 900;">📝 Blog Manager</h1>
                <p style="color: #6b7280; font-size: 14px; margin-top: 4px;">
                    Status: <span id="dbStatus" style="color:#eab308;">Connecting...</span>
                </p>
            </div>
            <a href="index.html" target="_blank" class="btn btn-green btn-sm" style="text-decoration:none;">🌐 View Site</a>
        </div>

        <!-- Blog Editor -->
        <div class="card">
            <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;" id="formTitle">✍️ Create New Blog Post</h2>
            <input type="hidden" id="postId">
            <div class="grid-2">
                <div><label>Title *</label><input type="text" id="postTitle" placeholder="Enter blog post title..." required></div>
                <div><label>Slug (URL) *</label><input type="text" id="postSlug" placeholder="my-blog-post-slug" required></div>
            </div>
            <div class="grid-2">
                <div><label>Category</label><select id="postCategory"><option>Stock Lists</option><option>Strategy</option><option>Tools & Calculators</option><option>Tax Guide</option><option>Market News</option><option>General</option></select></div>
                <div><label>Author</label><input type="text" id="postAuthor" value="DividendStrike Research"></div>
            </div>
            <label>Excerpt</label><textarea id="postExcerpt" rows="2" placeholder="Brief description..."></textarea>
            <label>Keywords (comma separated)</label><input type="text" id="postKeywords" placeholder="keyword1, keyword2">
            <label>Content (HTML) *</label><textarea id="postContent" rows="15" placeholder="<h2>Title</h2><p>Content...</p>" required></textarea>
            <div style="display: flex; align-items: center; gap: 10px; margin: 12px 0;">
                <input type="checkbox" id="postPublished" style="width: auto; margin: 0;">
                <label style="margin: 0; cursor: pointer;">✅ Published</label>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="savePost()" class="btn btn-green">💾 Save Post</button>
                <button onclick="clearForm()" class="btn btn-gray">🔄 Clear</button>
            </div>
        </div>

        <!-- Posts List -->
        <div class="card">
            <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">📋 All Posts</h2>
            <div id="postsList"><p style="color:#6b7280;text-align:center;padding:40px;">Loading...</p></div>
        </div>
    </div>

    <script>
        // ============================================
        // 👇 REPLACE THESE WITH YOUR REAL SUPABASE CREDENTIALS 👇
        // ============================================
        const SUPABASE_URL = 'https://oezmykupzqjfuklxvxzi.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lem15a3VwenFqZnVrbHh2eHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTQ3MjgsImV4cCI6MjA5MzM5MDcyOH0.XM82bC4_DKRZ3s6N-zKlqCVxZkM95fcfHL2ddxj28SE';
        // ============================================

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Test connection on load
        async function testDB() {
            try {
                const { error } = await supabase.from('blog_posts').select('count', { count: 'exact', head: true });
                if (error) throw error;
                document.getElementById('dbStatus').innerHTML = '🟢 Connected to Supabase ✅';
                document.getElementById('dbStatus').style.color = '#22c55e';
                loadPosts();
            } catch (e) {
                document.getElementById('dbStatus').innerHTML = '🔴 Not connected: ' + e.message;
                document.getElementById('dbStatus').style.color = '#ef4444';
                console.error('DB Error:', e);
            }
        }

        async function loadPosts() {
            const { data, error } = await supabase.from('blog_posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('postsList');
            if (error) { container.innerHTML = `<p style="color:#ef4444;">Error: ${error.message}</p>`; return; }
            if (!data || data.length === 0) { container.innerHTML = '<p style="color:#6b7280;text-align:center;padding:40px;">No posts yet.</p>'; return; }
            container.innerHTML = data.map(p => `
                <div class="post-row">
                    <div style="flex:1;">
                        <span class="badge ${p.published ? 'badge-pub' : 'badge-draft'}">${p.published ? '📤 Published' : '📥 Draft'}</span>
                        <strong style="display:block;margin-top:6px;">${p.title}</strong>
                        <small style="color:#6b7280;">${p.slug} • ${new Date(p.created_at).toLocaleDateString('en-IN')}</small>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button onclick="editPost(${p.id})" class="btn btn-blue btn-sm">✏️</button>
                        <button onclick="deletePost(${p.id})" class="btn btn-red btn-sm">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function savePost() {
            const title = document.getElementById('postTitle').value.trim();
            const slug = document.getElementById('postSlug').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if (!title || !slug || !content) { showToast('❌ Fill all required fields', '#ef4444'); return; }
            
            const post = {
                title, slug, content,
                category: document.getElementById('postCategory').value,
                author: document.getElementById('postAuthor').value,
                excerpt: document.getElementById('postExcerpt').value.trim(),
                keywords: document.getElementById('postKeywords').value.split(',').map(k => k.trim()).filter(Boolean),
                published: document.getElementById('postPublished').checked
            };
            
            const id = document.getElementById('postId').value;
            const { error } = id ? await supabase.from('blog_posts').update(post).eq('id', id) : await supabase.from('blog_posts').insert([post]);
            
            if (error) { showToast('❌ ' + error.message, '#ef4444'); }
            else { showToast('✅ Post saved to database!', '#22c55e'); clearForm(); loadPosts(); }
        }

        async function editPost(id) {
            const { data } = await supabase.from('blog_posts').select('*').eq('id', id).single();
            if (!data) return;
            document.getElementById('formTitle').textContent = '✏️ Edit Post';
            document.getElementById('postId').value = data.id;
            document.getElementById('postTitle').value = data.title;
            document.getElementById('postSlug').value = data.slug;
            document.getElementById('postCategory').value = data.category;
            document.getElementById('postAuthor').value = data.author;
            document.getElementById('postExcerpt').value = data.excerpt || '';
            document.getElementById('postKeywords').value = (data.keywords || []).join(', ');
            document.getElementById('postContent').value = data.content;
            document.getElementById('postPublished').checked = data.published;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePost(id) {
            if (!confirm('Delete this post?')) return;
            await supabase.from('blog_posts').delete().eq('id', id);
            showToast('🗑️ Deleted', '#22c55e');
            loadPosts();
        }

        function clearForm() {
            document.getElementById('formTitle').textContent = '✍️ Create New Blog Post';
            ['postId','postTitle','postSlug','postExcerpt','postKeywords','postContent'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('postPublished').checked = false;
        }

        function showToast(msg, bg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.style.background = bg; t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); savePost(); }
        });

        testDB();
    </script>
</body>
</html>
