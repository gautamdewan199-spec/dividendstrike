<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DividendStrike — Blog Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card: #111118; --border: rgba(255,255,255,0.08); --green: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e5e7eb; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        input, textarea, select { width: 100%; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 16px; color: white; font-size: 14px; outline: none; margin-bottom: 12px; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus, select:focus { border-color: #22c55e; }
        select { cursor: pointer; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 4px; font-weight: 500; }
        .btn { padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-green { background: #22c55e; color: white; }
        .btn-green:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; color: white; }
        .btn-red:hover { background: #dc2626; }
        .btn-gray { background: #374151; color: white; }
        .btn-gray:hover { background: #4b5563; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-published { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-draft { background: rgba(234,179,8,0.2); color: #eab308; }
        .post-row { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
        .post-row:hover { background: rgba(255,255,255,0.02); }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 999; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <div style="max-width: 1000px; margin: 0 auto;">
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 900;">📝 Blog Manager</h1>
                <p style="color: #6b7280; font-size: 14px; margin-top: 4px;">Create, edit, and manage blog posts</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="loadPosts()" class="btn btn-gray btn-sm">🔄 Refresh</button>
                <a href="index.html" target="_blank" class="btn btn-blue btn-sm" style="text-decoration:none;">🌐 View Site</a>
            </div>
        </div>

        <!-- Blog Editor -->
        <div class="card">
            <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;" id="formTitle">✍️ Create New Blog Post</h2>
            
            <input type="hidden" id="postId">
            
            <div class="grid-2">
                <div>
                    <label>Title *</label>
                    <input type="text" id="postTitle" placeholder="Enter blog post title..." required>
                </div>
                <div>
                    <label>Slug (URL) *</label>
                    <input type="text" id="postSlug" placeholder="my-blog-post-slug" required>
                </div>
            </div>
            
            <div class="grid-2">
                <div>
                    <label>Category</label>
                    <select id="postCategory">
                        <option>Stock Lists</option>
                        <option>Strategy</option>
                        <option>Tools & Calculators</option>
                        <option>Tax Guide</option>
                        <option>Market News</option>
                        <option>PSU Analysis</option>
                        <option>General</option>
                    </select>
                </div>
                <div>
                    <label>Author</label>
                    <input type="text" id="postAuthor" value="DividendStrike Research">
                </div>
            </div>
            
            <label>Excerpt / Meta Description</label>
            <textarea id="postExcerpt" rows="2" placeholder="Brief description for SEO and preview cards..."></textarea>
            
            <label>Keywords (comma separated)</label>
            <input type="text" id="postKeywords" placeholder="keyword1, keyword2, keyword3">
            
            <label>Content (HTML) *</label>
            <textarea id="postContent" rows="15" placeholder="<h2>Your heading</h2>
<p>Your content here. Use HTML tags for formatting.</p>
<table>
<tr><th>Stock</th><th>Yield</th></tr>
<tr><td>Coal India</td><td>7.85%</td></tr>
</table>" required></textarea>
            <p style="font-size: 11px; color: #6b7280; margin-top: 4px;">💡 Use HTML: &lt;h2&gt;, &lt;h3&gt;, &lt;p&gt;, &lt;table&gt;, &lt;ul&gt;, &lt;ol&gt;, &lt;strong&gt;, &lt;a&gt;</p>
            
            <div style="display: flex; align-items: center; gap: 10px; margin: 12px 0;">
                <input type="checkbox" id="postPublished" style="width: auto; margin: 0;">
                <label style="margin: 0; cursor: pointer;">✅ Published (visible to public)</label>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="savePost()" class="btn btn-green">💾 Save Post</button>
                <button onclick="clearForm()" class="btn btn-gray">🔄 Clear Form</button>
            </div>
        </div>

        <!-- Posts List -->
        <div class="card">
            <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">📋 All Blog Posts</h2>
            <div id="postsList">
                <p style="color: #6b7280; text-align: center; padding: 40px;">Loading posts...</p>
            </div>
        </div>
        
        <!-- Connection Status -->
        <div style="text-align: center; padding: 10px; color: #6b7280; font-size: 12px;">
            <span id="connectionStatus">🟡 Not connected to database</span>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURE YOUR SUPABASE CREDENTIALS
        // ============================================
        const SUPABASE_URL = 'https://oezmykupzqjfuklxvxzi.supabase.co/rest/v1/';  // ← CHANGE THIS
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lem15a3VwenFqZnVrbHh2eHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTQ3MjgsImV4cCI6MjA5MzM5MDcyOH0.XM82bC4_DKRZ3s6N-zKlqCVxZkM95fcfHL2ddxj28SE';                   // ← CHANGE THIS
        
        // ============================================
        // INITIALIZE SUPABASE
        // ============================================
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            testConnection();
        } catch (e) {
            document.getElementById('connectionStatus').innerHTML = '🔴 Supabase not configured - edit SUPABASE_URL in code';
            console.error('Supabase error:', e);
        }
        
        // Test database connection
        async function testConnection() {
            try {
                const { data, error } = await supabase.from('blog_posts').select('count', { count: 'exact', head: true });
                if (error) throw error;
                document.getElementById('connectionStatus').innerHTML = '🟢 Connected to database ✅';
                loadPosts();
            } catch (e) {
                document.getElementById('connectionStatus').innerHTML = '🔴 Connection failed: ' + e.message;
                console.error('Connection error:', e);
            }
        }
        
        // ============================================
        // LOAD ALL POSTS
        // ============================================
        async function loadPosts() {
            const container = document.getElementById('postsList');
            container.innerHTML = '<p style="color:#6b7280;text-align:center;padding:40px;">Loading...</p>';
            
            try {
                const { data, error } = await supabase
                    .from('blog_posts')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color:#6b7280;text-align:center;padding:40px;">📝 No posts yet. Create your first blog post above!</p>';
                    return;
                }
                
                container.innerHTML = data.map(post => `
                    <div class="post-row">
                        <div style="flex:1;">
                            <span class="badge ${post.published ? 'badge-published' : 'badge-draft'}">${post.published ? '📤 Published' : '📥 Draft'}</span>
                            <span style="font-size:12px;color:#6b7280;margin-left:8px;">${post.category || 'General'}</span>
                            <strong style="display:block;margin-top:6px;font-size:15px;">${post.title}</strong>
                            <small style="color:#6b7280;">Slug: ${post.slug} • ${new Date(post.created_at).toLocaleDateString('en-IN')}</small>
                        </div>
                        <div style="display:flex;gap:8px;flex-shrink:0;">
                            <button onclick="editPost(${post.id})" class="btn btn-blue btn-sm">✏️ Edit</button>
                            <button onclick="togglePublish(${post.id}, ${post.published})" class="btn btn-gray btn-sm">${post.published ? '📥' : '📤'}</button>
                            <button onclick="deletePost(${post.id})" class="btn btn-red btn-sm">🗑️</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (e) {
                container.innerHTML = `<p style="color:#ef4444;text-align:center;padding:40px;">❌ Error: ${e.message}</p>`;
                console.error('Load error:', e);
            }
        }
        
        // ============================================
        // SAVE POST (CREATE OR UPDATE)
        // ============================================
        async function savePost() {
            const title = document.getElementById('postTitle').value.trim();
            const slug = document.getElementById('postSlug').value.trim();
            const content = document.getElementById('postContent').value.trim();
            
            if (!title || !slug || !content) {
                showToast('❌ Please fill in Title, Slug, and Content', '#ef4444');
                return;
            }
            
            const postData = {
                title: title,
                slug: slug,
                category: document.getElementById('postCategory').value,
                author: document.getElementById('postAuthor').value || 'DividendStrike Research',
                excerpt: document.getElementById('postExcerpt').value.trim(),
                keywords: document.getElementById('postKeywords').value.split(',').map(k => k.trim()).filter(Boolean),
                content: content,
                published: document.getElementById('postPublished').checked,
                read_time: '5 min read'
            };
            
            const postId = document.getElementById('postId').value;
            
            try {
                let result;
                if (postId) {
                    // Update existing post
                    result = await supabase.from('blog_posts').update(postData).eq('id', postId);
                } else {
                    // Create new post
                    result = await supabase.from('blog_posts').insert([postData]);
                }
                
                if (result.error) throw result.error;
                
                showToast('✅ Post saved successfully!', '#22c55e');
                clearForm();
                loadPosts();
            } catch (e) {
                showToast('❌ Error: ' + e.message, '#ef4444');
                console.error('Save error:', e);
            }
        }
        
        // ============================================
        // EDIT POST
        // ============================================
        async function editPost(id) {
            try {
                const { data, error } = await supabase.from('blog_posts').select('*').eq('id', id).single();
                if (error) throw error;
                if (!data) { showToast('Post not found', '#ef4444'); return; }
                
                document.getElementById('formTitle').textContent = '✏️ Edit Blog Post';
                document.getElementById('postId').value = data.id;
                document.getElementById('postTitle').value = data.title;
                document.getElementById('postSlug').value = data.slug;
                document.getElementById('postCategory').value = data.category || 'General';
                document.getElementById('postAuthor').value = data.author || 'DividendStrike Research';
                document.getElementById('postExcerpt').value = data.excerpt || '';
                document.getElementById('postKeywords').value = (data.keywords || []).join(', ');
                document.getElementById('postContent').value = data.content;
                document.getElementById('postPublished').checked = data.published;
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                showToast('❌ Error: ' + e.message, '#ef4444');
            }
        }
        
        // ============================================
        // TOGGLE PUBLISH
        // ============================================
        async function togglePublish(id, currentStatus) {
            try {
                const { error } = await supabase.from('blog_posts').update({ published: !currentStatus }).eq('id', id);
                if (error) throw error;
                showToast(currentStatus ? '📥 Post unpublished' : '📤 Post published!', '#22c55e');
                loadPosts();
            } catch (e) {
                showToast('❌ Error: ' + e.message, '#ef4444');
            }
        }
        
        // ============================================
        // DELETE POST
        // ============================================
        async function deletePost(id) {
            if (!confirm('⚠️ Are you sure you want to delete this post? This cannot be undone.')) return;
            
            try {
                const { error } = await supabase.from('blog_posts').delete().eq('id', id);
                if (error) throw error;
                showToast('🗑️ Post deleted', '#22c55e');
                loadPosts();
            } catch (e) {
                showToast('❌ Error: ' + e.message, '#ef4444');
            }
        }
        
        // ============================================
        // CLEAR FORM
        // ============================================
        function clearForm() {
            document.getElementById('formTitle').textContent = '✍️ Create New Blog Post';
            document.getElementById('postId').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postSlug').value = '';
            document.getElementById('postCategory').value = 'General';
            document.getElementById('postAuthor').value = 'DividendStrike Research';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postKeywords').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postPublished').checked = false;
        }
        
        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, bgColor) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = bgColor;
            toast.style.color = 'white';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            // Ctrl+S to save
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                savePost();
            }
            // Ctrl+N for new post
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                clearForm();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        
        console.log('✅ Blog Manager Ready');
        console.log('💡 Shortcuts: Ctrl+S = Save | Ctrl+N = New Post');
    </script>
</body>
</html>
