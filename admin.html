<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DividendStrike — Blog Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e5e7eb;padding:20px}
        .container{max-width:900px;margin:0 auto}
        .card{background:#111118;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:20px}
        input,textarea,select{width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;color:white;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit}
        textarea{resize:vertical;min-height:100px}
        input:focus,textarea:focus,select:focus{border-color:#22c55e}
        select{cursor:pointer}
        label{display:block;font-size:12px;color:#9ca3af;margin-bottom:4px;font-weight:500}
        button{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;color:white}
        .btn-save{background:#22c55e}.btn-save:hover{background:#16a34a}
        .btn-edit{background:#3b82f6;color:white;padding:6px 12px;font-size:12px;border-radius:6px;border:none;cursor:pointer}
        .btn-delete{background:#ef4444;color:white;padding:6px 12px;font-size:12px;border-radius:6px;border:none;cursor:pointer}
        .btn-gray{background:#374151}.btn-gray:hover{background:#4b5563}
        .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .badge-pub{background:rgba(34,197,94,0.2);color:#22c55e}
        .badge-draft{background:rgba(234,179,8,0.2);color:#eab308}
        .post-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,0.05)}
        .toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:12px;color:white;font-size:14px;z-index:999}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        @media(max-width:600px){.grid-2{grid-template-columns:1fr}}
        h1{font-weight:900}
    </style>
</head>
<body>

    <div id="toastBox"></div>

    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h1 style="font-size:24px;">📝 Blog Manager</h1>
            <div style="display:flex;gap:10px;">
                <button onclick="exportPosts()" class="btn-gray" style="font-size:12px;">📥 Export</button>
                <button onclick="importPosts()" class="btn-gray" style="font-size:12px;">📤 Import</button>
                <a href="blog.html" target="_blank" style="background:#22c55e;color:white;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;">🌐 View Blog</a>
            </div>
        </div>

        <!-- FORM -->
        <div class="card">
            <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;" id="formTitle">✍️ Create New Post</h2>
            <input type="hidden" id="postId">
            
            <div class="grid-2">
                <div><label>Title *</label><input type="text" id="postTitle" placeholder="Post title"></div>
                <div><label>Slug (URL) *</label><input type="text" id="postSlug" placeholder="my-post-slug"></div>
            </div>
            <div class="grid-2">
                <div><label>Category</label><select id="postCategory"><option>Stock Lists</option><option>Strategy</option><option>Tax Guide</option><option>Market News</option><option>General</option></select></div>
                <div><label>Author</label><input type="text" id="postAuthor" value="DividendStrike Research"></div>
            </div>
            <label>Excerpt</label><textarea id="postExcerpt" rows="2" placeholder="Brief description..."></textarea>
            <label>Keywords (comma separated)</label><input type="text" id="postKeywords" placeholder="keyword1, keyword2">
            <label>Content (HTML) *</label><textarea id="postContent" rows="12" placeholder="<h2>Title</h2><p>Content...</p>"></textarea>
            <div style="display:flex;align-items:center;gap:10px;margin:12px 0;">
                <input type="checkbox" id="postPublished" style="width:auto;margin:0;">
                <label style="margin:0;cursor:pointer;">✅ Published</label>
            </div>
            <div style="display:flex;gap:10px;">
                <button onclick="savePost()" class="btn-save">💾 Save Post</button>
                <button onclick="clearForm()" class="btn-gray">🔄 Clear</button>
            </div>
        </div>

        <!-- POSTS LIST -->
        <div class="card">
            <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">📋 All Posts (<span id="count">0</span>)</h2>
            <div id="postsList"><p style="color:#6b7280;text-align:center;padding:30px;">No posts yet</p></div>
        </div>
    </div>

    <script>
        var STORAGE_KEY = 'dividendstrike_blog_posts';

        function getPosts() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } 
            catch(e) { return []; }
        }

        async function savePost() {
    var title = document.getElementById('postTitle').value.trim();
    var slug = document.getElementById('postSlug').value.trim();
    var content = document.getElementById('postContent').value.trim();
    
    if (!title || !slug || !content) {
        showToast('❌ Please fill in Title, Slug, and Content', '#ef4444');
        return;
    }
    
    var postData = {
        title: title,
        slug: slug,
        category: document.getElementById('postCategory').value,
        author: document.getElementById('postAuthor').value || 'DividendStrike Research',
        excerpt: document.getElementById('postExcerpt').value.trim(),
        keywords: document.getElementById('postKeywords').value.split(',').map(function(k) { return k.trim(); }).filter(function(k) { return k; }),
        content: content,
        published: document.getElementById('postPublished').checked,
        read_time: '5 min read',
        updated_at: new Date().toISOString()
    };
    
    var postId = document.getElementById('postId').value;
    
    try {
        var result;
        if (postId) {
            // Update existing post in Supabase
            result = await supabase.from('blog_posts').update(postData).eq('id', postId);
        } else {
            // Insert new post to Supabase
            result = await supabase.from('blog_posts').insert([postData]);
        }
        
        if (result.error) {
            throw result.error;
        }
        
        showToast('✅ Post saved to cloud! Available on all devices.', '#22c55e');
        clearForm();
        loadPosts();
        
    } catch(e) {
        // If Supabase fails, save locally as backup
        console.error('Supabase error, saving locally:', e.message);
        
        var posts = [];
        try { 
            posts = JSON.parse(localStorage.getItem('dividendstrike_blog_posts') || '[]'); 
        } catch(err) {}
        
        postData.id = postId || 'local_' + Date.now();
        postData.created_at = new Date().toISOString();
        
        if (postId) {
            var idx = posts.findIndex(function(p) { return p.id == postId; });
            if (idx > -1) { posts[idx] = postData; }
        } else {
            posts.push(postData);
        }
        
        localStorage.setItem('dividendstrike_blog_posts', JSON.stringify(posts));
        showToast('⚠️ Cloud save failed. Saved locally only.', '#eab308');
        
        clearForm();
        loadPosts();
    }
}

        function showToast(msg, color) {
            var t = document.createElement('div');
            t.className = 'toast';
            t.style.background = color || '#22c55e';
            t.textContent = msg;
            document.getElementById('toastBox').appendChild(t);
            setTimeout(function(){ t.remove(); }, 2500);
        }

        function loadPosts() {
            var posts = getPosts();
            posts.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
            document.getElementById('count').textContent = posts.length;
            var html = '';
            if (posts.length === 0) {
                html = '<p style="color:#6b7280;text-align:center;padding:30px;">No posts yet. Create one above!</p>';
            } else {
                posts.forEach(function(p){
                    html += '<div class="post-item">';
                    html += '<div><span class="badge '+(p.published?'badge-pub':'badge-draft')+'">'+(p.published?'📤 Published':'📥 Draft')+'</span> ';
                    html += '<strong>'+p.title+'</strong><br><small style="color:#6b7280;">'+p.slug+'</small></div>';
                    html += '<div style="display:flex;gap:6px;">';
                    html += '<button onclick="editPost(\''+p.id+'\')" class="btn-edit">✏️</button>';
                    html += '<button onclick="deletePost(\''+p.id+'\')" class="btn-delete">🗑️</button>';
                    html += '</div></div>';
                });
            }
            document.getElementById('postsList').innerHTML = html;
        }

        function savePost() {
            var title = document.getElementById('postTitle').value.trim();
            var slug = document.getElementById('postSlug').value.trim();
            var content = document.getElementById('postContent').value.trim();
            if (!title || !slug || !content) { showToast('❌ Fill all required fields', '#ef4444'); return; }
            
            var posts = getPosts();
            var id = document.getElementById('postId').value;
            
            var post = {
                id: id || 'p_'+Date.now(),
                title: title, slug: slug,
                category: document.getElementById('postCategory').value,
                author: document.getElementById('postAuthor').value,
                excerpt: document.getElementById('postExcerpt').value.trim(),
                keywords: document.getElementById('postKeywords').value.split(',').map(function(k){return k.trim();}).filter(function(k){return k;}),
                content: content,
                published: document.getElementById('postPublished').checked,
                read_time: '5 min read',
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            };
            
            if (id) {
                var idx = posts.findIndex(function(p){ return p.id === id; });
                if (idx > -1) { post.created_at = posts[idx].created_at; posts[idx] = post; }
            } else {
                posts.push(post);
            }
            
            savePosts(posts);
            showToast('✅ Post saved!', '#22c55e');
            clearForm();
            loadPosts();
        }

        function editPost(id) {
            var post = getPosts().find(function(p){ return p.id === id; });
            if (!post) return;
            document.getElementById('formTitle').textContent = '✏️ Edit Post';
            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postSlug').value = post.slug;
            document.getElementById('postCategory').value = post.category||'General';
            document.getElementById('postAuthor').value = post.author||'';
            document.getElementById('postExcerpt').value = post.excerpt||'';
            document.getElementById('postKeywords').value = (post.keywords||[]).join(', ');
            document.getElementById('postContent').value = post.content;
            document.getElementById('postPublished').checked = post.published;
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function deletePost(id) {
            if (!confirm('Delete this post?')) return;
            savePosts(getPosts().filter(function(p){ return p.id !== id; }));
            showToast('🗑️ Deleted', '#22c55e');
            loadPosts();
        }

        function clearForm() {
            document.getElementById('formTitle').textContent = '✍️ Create New Post';
            document.getElementById('postId').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postSlug').value = '';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postKeywords').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postPublished').checked = false;
        }

        function exportPosts() {
            var posts = getPosts();
            if (posts.length === 0) { showToast('No posts to export', '#eab308'); return; }
            var blob = new Blob([JSON.stringify(posts, null, 2)], {type:'application/json'});
            var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'blog_backup_'+new Date().toISOString().split('T')[0]+'.json'; a.click();
            showToast('📥 Backup downloaded!', '#22c55e');
        }

        function importPosts() {
            var input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
            input.onchange = function(e){
                var reader = new FileReader();
                reader.onload = function(ev){
                    try {
                        var posts = JSON.parse(ev.target.result);
                        savePosts(posts);
                        showToast('✅ Imported '+posts.length+' posts!', '#22c55e');
                        loadPosts();
                    } catch(err) { showToast('❌ Invalid file', '#ef4444'); }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        document.addEventListener('keydown', function(e){
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); savePost(); }
        });

        loadPosts();
        console.log('✅ Admin Panel Ready');
    </script>
</body>
</html>
