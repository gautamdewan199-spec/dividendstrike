        rec(s){if(!s.paysDividend)return{t:'No Dividend',c:'gray',e:'⚪'};const h=this.health(s),p=this.growth(s);if(h>=85&&p.cagr>15)return{t:'Strong Buy',c:'green',e:'🟢'};if(h>=72&&p.cagr>8)return{t:'Buy',c:'blue',e:'🔵'};if(h>=60&&p.cagr>3)return{t:'Hold',c:'yellow',e:'🟡'};return{t:'Review',c:'red',e:'🔴'};},
        sustain(s){if(!s.paysDividend)return{sc:0,r:'N/A',c:'gray'};const fc=(s.fcf||0)>0?Math.min(2,((s.fcf||0)/1000)/((s.divPerShare||1)*100)):0;const pc=(s.payoutRatio||50)<40?1:(s.payoutRatio||50)<65?0.8:(s.payoutRatio||50)<85?0.5:0.2;const ds=Math.max(0,1-(s.de||1)/2);const cf=(s.divConsistency||0)/30;const score=Math.round((fc*0.35+pc*0.25+ds*0.2+cf*0.2)*100);return{sc:Math.min(98,score),r:score>=75?'Highly Sustainable':score>=55?'Sustainable':score>=35?'Moderate':'At Risk',c:score>=75?'green':score>=55?'blue':score>=35?'yellow':'red'};}

    // State
    const ST={tab:'dashboard',wl:JSON.parse(localStorage.getItem('dswl')||'[]'),pf:JSON.parse(localStorage.getItem('dspf')||'[]'),cmp:JSON.parse(localStorage.getItem('dscmp')||'[]'),filter:'all',page:1,sortCol:'score',sortDir:'desc',query:'',simStock:null,sim:{capital:500000,years:10,reinvest:true,tax:'20'}};

    function toast(m,t='info'){const c=document.getElementById('toastContainer');const cl={success:'bg-green-600',info:'bg-blue-600',warning:'bg-yellow-600',error:'bg-red-600'};const d=document.createElement('div');d.className=`${cl[t]} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs`;d.style.animation='slideDown 0.3s ease-out';d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500);}
    function fmt(n){if(Math.abs(n)>=1e7)return`₹${(n/1e7).toFixed(2)} Cr`;if(Math.abs(n)>=1e5)return`₹${(n/1e5).toFixed(2)} L`;return`₹${n.toFixed(2)}`;}

    function sortList(list,col,dir){return[...list].sort((a,b)=>{let va,vb;switch(col){case'symbol':va=a.symbol||'';vb=b.symbol||'';break;case'price':va=a.price||0;vb=b.price||0;break;case'yield':va=a.divYield||0;vb=b.divYield||0;break;case'growth':va=a.divGrowth3Y||0;vb=b.divGrowth3Y||0;break;case'score':va=AI.health(a);vb=AI.health(b);break;case'sustainability':va=AI.sustain(a).sc;vb=AI.sustain(b).sc;break;default:return 0;}if(typeof va==='string')return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);return dir==='asc'?va-vb:vb-va;});}
    function getFiltered(filter){let list=[...stocks];if(filter==='high-yield')list=list.filter(s=>s.paysDividend&&s.divYield>4);if(filter==='high-growth')list=list.filter(s=>s.paysDividend&&s.divGrowth3Y>20);if(filter==='watchlist')list=list.filter(s=>ST.wl.includes(s.symbol));if(filter==='portfolio')list=list.filter(s=>ST.pf.some(p=>p.symbol===s.symbol));if(filter==='non-payers')list=list.filter(s=>!s.paysDividend);if(filter==='payers')list=list.filter(s=>s.paysDividend);if(ST.query&&(filter==='search'||filter==='all')){const q=ST.query.toUpperCase().trim();list=list.filter(s=>s.symbol.includes(q)||s.name.toUpperCase().includes(q)||s.sector.toUpperCase().includes(q));}if(ST.sortCol)list=sortList(list,ST.sortCol,ST.sortDir);return list;}

    function doSort(col){if(ST.sortCol===col)ST.sortDir=ST.sortDir==='asc'?'desc':'asc';else{ST.sortCol=col;ST.sortDir='desc';}ST.page=1;renderView();}

    function searchStocks(q){if(!q||q.trim().length<1)return[];const qu=q.toUpperCase().trim();return stocks.filter(s=>s.symbol.includes(qu)||s.name.toUpperCase().includes(qu)||s.sector.toUpperCase().includes(qu)).slice(0,12);}
    function showDropdown(results,ddId){const dd=document.getElementById(ddId);if(!dd)return;if(!results||results.length===0){dd.innerHTML='';dd.classList.add('hidden');return;}dd.innerHTML=results.map(s=>`<div class="px-3 py-2 hover:bg-green-500/10 cursor-pointer text-xs border-b border-white/5" onmousedown="event.preventDefault();pickResult('${s.symbol}','${ddId}')"><span class="font-semibold">${s.symbol}</span><span class="text-gray-400 ml-2">${s.name.substring(0,22)}</span><span class="text-[10px] ${s.paysDividend?'text-green-400':'text-gray-500'} ml-auto">${s.paysDividend?s.divYield.toFixed(1)+'%':s.sector}</span></div>`).join('');dd.classList.remove('hidden');}

        addPF(sym,qty,price){const ex=ST.pf.find(p=>p.symbol===sym);if(ex){const tc=ex.quantity*ex.buyPrice+qty*price;ex.quantity+=qty;ex.buyPrice=tc/ex.quantity;}else ST.pf.push({symbol:sym,quantity:qty,buyPrice:price});localStorage.setItem('dspf',JSON.stringify(ST.pf));toast(`Added ${qty} shares 📊`,'success');renderView();},

            h+=`</tr>`;});

function stripHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
}

function formatDate(dateStr) {
    try {
        return new Date(dateStr).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
    } catch(e) {
        return dateStr;
    }
}

function formatDateLong(dateStr) {
    try {
        return new Date(dateStr).toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    } catch(e) {
        return dateStr;
    }
}

        <div>
            <h3 class="font-bold text-lg mb-3">📚 Related Articles</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${related.map(rp => `
                    <div class="data-card clickable rounded-2xl p-4" onclick="renderBlogPost('${rp.id}')">
                        <span class="px-2 py-1 rounded-full text-[10px] bg-green-500/20 text-green-400">${rp.category}</span>
                        <h4 class="font-bold text-sm mt-2 mb-1 hover:text-green-400">${rp.title}</h4>
                        <p class="text-[10px] text-gray-500">📅 ${new Date(rp.created_at).toLocaleDateString('en-IN')}</p>
                    </div>
                `).join('')}
            </div>
        </div>` : ''}
    </div>`;
    
    lucide.createIcons();
    window.scrollTo({top: 0, behavior: 'smooth'});
    
    // Style tables inside blog content
    setTimeout(() => {
        document.querySelectorAll('.blog-content table').forEach(table => {
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.style.margin = '16px 0';
        });
        document.querySelectorAll('.blog-content th').forEach(th => {
            th.style.background = 'rgba(34,197,94,0.1)';
            th.style.color = '#22c55e';
            th.style.padding = '10px 14px';
            th.style.textAlign = 'left';
            th.style.borderBottom = '2px solid rgba(34,197,94,0.3)';
            th.style.fontSize = '13px';
        });
        document.querySelectorAll('.blog-content td').forEach(td => {
            td.style.padding = '10px 14px';
            td.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
            td.style.fontSize = '13px';
            td.style.color = '#d1d5db';
        });
    }, 100);
}

function shareBlog(title) {
    const url = window.location.href;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank');
}

function copyBlogLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('📋 Link copied!', 'success');
    });
}
    </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
