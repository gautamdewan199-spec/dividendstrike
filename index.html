<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DividendStrike — Best Dividend Paying Stocks India 2026</title>
    <meta name="description" content="Find highest dividend yield NSE stocks with AI screener. Track dividend history, DRIP calculator, sustainability scores.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card: rgba(15,15,25,0.85); --border: rgba(255,255,255,0.07); }
        * { margin:0; padding:0; box-sizing:border-box; }
        *::-webkit-scrollbar { width:4px; height:4px; }
        *::-webkit-scrollbar-track { background:transparent; }
        *::-webkit-scrollbar-thumb { background:#1f2937; border-radius:2px; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:#e5e7eb; }
        .data-card { backdrop-filter:blur(20px); background:var(--card); border:1px solid var(--border); transition:all 0.3s ease; }
        .data-card.clickable:hover { border-color:rgba(34,197,94,0.35); box-shadow:0 20px 50px -15px rgba(34,197,94,0.2); transform:translateY(-2px); cursor:pointer; }
        .glow-border { position:relative; }
        .glow-border::before { content:''; position:absolute; inset:-2px; border-radius:inherit; background:linear-gradient(135deg,rgba(34,197,94,0.25),rgba(59,130,246,0.25)); z-index:-1; filter:blur(18px); opacity:0.5; }
        th.sortable { cursor:pointer; user-select:none; }
        th.sortable:hover { color:#22c55e !important; }
        .sort-indicator { display:inline-block; margin-left:4px; font-size:10px; color:#22c55e; }
        .sort-indicator.asc { transform:rotate(0deg); } .sort-indicator.desc { transform:rotate(180deg); }
        .stock-row:hover { background:rgba(34,197,94,0.05); cursor:pointer; }
        .filter-active { background:rgba(34,197,94,0.2) !important; border-color:rgba(34,197,94,0.5) !important; color:#22c55e !important; }
        .nav-active { background:rgba(34,197,94,0.15); color:#22c55e !important; border-bottom:2px solid #22c55e; }
        .search-dropdown { position:absolute; top:100%; left:0; right:0; z-index:150; background:#1a1a2e; border:1px solid rgba(255,255,255,0.15); border-radius:12px; margin-top:4px; max-height:300px; overflow-y:auto; box-shadow:0 25px 60px rgba(0,0,0,0.7); }
        #liveClock { display:inline-block; min-width:70px; text-align:center; font-variant-numeric:tabular-nums; }
    </style>
</head>
<body class="min-h-screen bg-[var(--bg)]">

    <div id="toastContainer" class="fixed top-4 right-4 z-[300] space-y-2"></div>

    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#0a0a0f]/95 border-b border-white/5">
        <div class="max-w-[1440px] mx-auto px-3 lg:px-5 py-2.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="w-9 h-9 bg-gradient-to-br from-green-500 to-emerald-600 rounded-lg flex items-center justify-center shadow-lg shadow-green-500/20">
                    <span class="text-white font-black text-sm">₹</span>
                </div>
                <div class="hidden sm:block">
                    <span class="text-lg font-black">Dividend<span class="text-green-400">Strike</span></span>
                    <p class="text-[9px] text-gray-500 -mt-1 tracking-widest uppercase">NSE Dividend Intelligence</p>
                </div>
            </div>
            <div class="hidden lg:flex items-center gap-0.5 text-xs font-medium">
                <button onclick="switchTab('dashboard')" data-nav="dashboard" class="nav-btn px-3 py-1.5 rounded-lg text-green-400 hover:bg-white/5 nav-active">📊 Dashboard</button>
                <button onclick="switchTab('toppayers')" data-nav="toppayers" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">🏆 Top Payers</button>
                <button onclick="switchTab('screener')" data-nav="screener" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">🔍 Screener</button>
                <button onclick="switchTab('simulator')" data-nav="simulator" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">🧮 Simulator</button>
                <button onclick="switchTab('compare')" data-nav="compare" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">⚖️ Compare</button>
                <button onclick="switchTab('portfolio')" data-nav="portfolio" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">💼 Portfolio</button>
                <button onclick="switchTab('blog')" data-nav="blog" class="nav-btn px-3 py-1.5 rounded-lg text-gray-300 hover:bg-white/5">📝 Blog</button>
            </div>
            <div class="flex items-center gap-3">
                <span class="hidden md:flex items-center gap-1.5 text-[10px]"><span class="w-1.5 h-1.5 bg-green-500 rounded-full" style="animation:pulse 2s infinite;"></span><span class="text-gray-400">NSE</span><span id="liveClock" class="text-gray-500 font-mono">--:--:--</span></span>
                <button class="lg:hidden text-white" onclick="document.getElementById('mobileMenu').classList.toggle('hidden')"><i data-lucide="menu" class="w-5 h-5"></i></button>
            </div>
        </div>
        <div id="mobileMenu" class="lg:hidden hidden border-t border-white/5 px-3 py-2 grid grid-cols-2 gap-1">
            <button onclick="switchTab('dashboard');document.getElementById('mobileMenu').classList.toggle('hidden')" class="text-left px-3 py-2 rounded-lg text-green-400 text-xs">📊 Dashboard</button>
            <button onclick="switchTab('toppayers');document.getElementById('mobileMenu').classList.toggle('hidden')" class="text-left px-3 py-2 rounded-lg text-gray-300 text-xs">🏆 Top Payers</button>
            <button onclick="switchTab('blog');document.getElementById('mobileMenu').classList.toggle('hidden')" class="text-left px-3 py-2 rounded-lg text-gray-300 text-xs">📝 Blog</button>
            <button onclick="switchTab('portfolio');document.getElementById('mobileMenu').classList.toggle('hidden')" class="text-left px-3 py-2 rounded-lg text-gray-300 text-xs">💼 Portfolio</button>
        </div>
    </nav>

    <main id="appContent" class="max-w-[1440px] mx-auto px-3 lg:px-5 py-4">
        <div class="text-center py-20"><p class="text-gray-400 text-sm">Loading...</p></div>
    </main>

    <footer class="border-t border-white/5 py-4 px-3 text-center">
        <p class="text-[10px] text-gray-600"><span id="stockCountFooter"></span> • Not Financial Advice</p>
    </footer>

    <script>
    // ============================================
    // BLOG FUNCTIONS (MUST BE DEFINED FIRST)
    // ============================================
    function getBlogPosts() {
        try {
            const posts = localStorage.getItem('dividendstrike_blog_posts');
            return posts ? JSON.parse(posts) : [];
        } catch(e) { return []; }
    }

    function renderBlog() {
        const allPosts = getBlogPosts();
        const posts = allPosts.filter(p => p.published).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        const app = document.getElementById('appContent');
        
        if (posts.length === 0) {
            app.innerHTML = `
            <div class="data-card rounded-2xl p-12 text-center">
                <p style="font-size:60px;margin-bottom:16px;">📝</p>
                <p class="text-gray-400 text-lg">No blog posts published yet.</p>
                <p class="text-gray-600 text-sm mt-2">Blog posts created in the admin panel will appear here.</p>
                <p class="text-gray-700 text-xs mt-4">Storage: ${allPosts.length} total posts (${allPosts.filter(p=>p.published).length} published)</p>
            </div>`;
            lucide.createIcons();
            return;
        }
        
        app.innerHTML = `
        <div class="space-y-6">
            <div class="text-center mb-4">
                <h1 class="text-3xl font-black mb-2">📝 Dividend Investing Blog</h1>
                <p class="text-gray-400 text-sm">Expert guides, stock analysis, and dividend strategies</p>
                <p class="text-xs text-gray-600 mt-2">${posts.length} article${posts.length>1?'s':''} published</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${posts.map(post => `
                    <div class="data-card clickable rounded-2xl p-5" onclick="renderBlogPost('${post.id}')">
                        <span class="px-2 py-1 rounded-full text-[10px] font-semibold bg-green-500/20 text-green-400">${post.category || 'General'}</span>
                        <h2 class="font-bold text-base mt-2 mb-2">${post.title}</h2>
                        <p class="text-gray-400 text-xs mb-4">${post.excerpt || post.content.replace(/<[^>]*>/g,'').substring(0,120)+'...'}</p>
                        <div class="flex items-center justify-between text-[10px] text-gray-500">
                            <span>✍️ ${post.author||'DividendStrike'}</span>
                            <span>📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>`;
        lucide.createIcons();
    }

    function renderBlogPost(postId) {
        const posts = getBlogPosts();
        const post = posts.find(p => p.id === postId);
        const app = document.getElementById('appContent');
        
        if (!post) {
            app.innerHTML = `<div class="text-center py-20"><p class="text-gray-500">Post not found</p><button onclick="renderBlog()" class="mt-4 px-4 py-2 bg-green-600 rounded-lg text-sm">← Back</button></div>`;
            return;
        }
        
        const related = posts.filter(p => p.id !== post.id && p.category === post.category && p.published).slice(0,3);
        
        app.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6">
            <button onclick="renderBlog()" class="text-gray-400 hover:text-white text-xs">← Back to Blog</button>
            <article class="data-card rounded-2xl p-6 lg:p-8">
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-500/20 text-green-400">${post.category||'General'}</span>
                <h1 class="text-2xl lg:text-3xl font-black mt-3 mb-2">${post.title}</h1>
                ${post.excerpt?`<p class="text-gray-400 text-sm mb-4">${post.excerpt}</p>`:''}
                <div class="flex items-center gap-4 text-xs text-gray-500 border-b border-white/10 pb-4 mb-6">
                    <span>✍️ ${post.author||'DividendStrike'}</span>
                    <span>📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>
                </div>
                <div class="blog-content" style="line-height:1.8;color:#d1d5db;font-size:15px;">${post.content}</div>
            </article>
            ${related.length>0?`
            <div><h3 class="font-bold text-lg mb-3">📚 Related</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${related.map(rp=>`<div class="data-card clickable rounded-2xl p-4" onclick="renderBlogPost('${rp.id}')"><span class="px-2 py-1 rounded-full text-[10px] bg-green-500/20 text-green-400">${rp.category}</span><h4 class="font-bold text-sm mt-2">${rp.title}</h4></div>`).join('')}
            </div></div>`:''}
        </div>`;
        lucide.createIcons();
        window.scrollTo({top:0,behavior:'smooth'});
    }

    // ============================================
    // STOCK DATABASE (abbreviated for space)
    // ============================================
    const DB = [
        {s:'RELIANCE',n:'Reliance Industries Ltd.',sec:'Oil & Gas',p:2850,pe:28.5,dps:9.0,dy:0.32,dg:8.5,dc:20,bh:2,pr:12,ph:50.33,fi:'Very Strong',mc:'₹19.3L Cr',dd:9.2,hl:72,fc:85000,de:0.45,roe:9.5,eps:100.5},
        {s:'TCS',n:'Tata Consultancy Services',sec:'IT',p:4250,pe:32.5,dps:73,dy:1.72,dg:16.5,dc:24,bh:6,pr:85,ph:72.3,fi:'Very Strong',mc:'₹15.5L Cr',dd:9.7,hl:88,fc:42000,de:0,roe:48.5,eps:130.8},
        {s:'ITC',n:'ITC Ltd.',sec:'FMCG',p:485,pe:28.5,dps:15.5,dy:3.19,dg:12.8,dc:28,bh:3,pr:82,ph:29.4,fi:'Strong',mc:'₹6.1L Cr',dd:9.2,hl:87,fc:16000,de:0.01,roe:30.5,eps:17.0},
        {s:'COALINDIA',n:'Coal India Ltd.',sec:'Mining',p:325,pe:8.2,dps:25.5,dy:7.85,dg:8.2,dc:15,bh:2,pr:65,ph:63.13,fi:'Neutral',mc:'₹2.0L Cr',dd:7.8,hl:92,fc:18000,de:0.05,roe:42.5,eps:39.6},
        {s:'ONGC',n:'Oil & Natural Gas Corp',sec:'Oil & Gas',p:220,pe:7.5,dps:11.5,dy:5.23,dg:9.0,dc:22,bh:2,pr:40,ph:58.89,fi:'Strong',mc:'₹2.8L Cr',dd:8.8,hl:79,fc:28000,de:0.55,roe:16.8,eps:29.3}
    ];

    // Process stocks
    const stocks = DB.map(st => ({
        symbol:st.s, name:st.n, sector:st.sec, price:st.p, pe:st.pe,
        divPerShare:st.dps, divYield:st.dy, divGrowth3Y:st.dg, divConsistency:st.dc,
        buybackHistory:st.bh, payoutRatio:st.pr, promoter:st.ph, fiidii:st.fi,
        mcap:st.mc, ddt:st.dd, health:st.hl, fcf:st.fc, de:st.de, roe:st.roe, eps:st.eps,
        paysDividend:st.dps>0.01&&st.dy>0.01&&st.pr>0, dividendHistory:[]
    }));

    stocks.forEach(s=>{if(s.paysDividend){const h=[];const now=new Date();let dps=s.divPerShare/Math.pow(1+Math.max(0,s.divGrowth3Y)/100,6);for(let i=6;i>=0;i--){const d=new Date(now.getFullYear()-i,Math.floor(Math.random()*12),Math.min(28,Math.floor(Math.random()*28)+1));h.push({date:d.toISOString().split('T')[0],dividendPerShare:Math.round(Math.max(0,dps)*100)/100,yield:Math.round((Math.max(0,dps)/(Math.random()*800+200))*10000)/100,type:i===0?'Final':Math.random()>0.4?'Interim':'Final'});dps*=(1+Math.max(0,s.divGrowth3Y)/100);}s.dividendHistory=h;}});

    const payers = stocks.filter(s=>s.paysDividend);
    const nonPayers = stocks.filter(s=>!s.paysDividend);

    // AI Engine
    const AI = {
        health(s){if(!s.paysDividend)return Math.min(25,s.health||5);let sc=0;sc+=Math.min(1,(s.divConsistency||0)/28)*22;sc+=Math.min(1,s.payoutRatio>0?Math.min(s.payoutRatio,80)/80:0.5)*14;sc+=((s.promoter||0)/75)*13;sc+=((s.ddt||0)/10)*10;sc+=((s.buybackHistory||0)/6)*8;const cm={'Very Strong':1,'Strong':0.82,'Moderate':0.55,'Neutral':0.38,'Weak':0.18};sc+=(cm[s.fiidii]||0.4)*11;sc+=((s.pe||30)<25?0.8:(s.pe||30)<50?0.5:0.3)*7;sc+=Math.min(1,Math.max(0,(s.fcf||0))/50000)*8;sc+=Math.max(0,1-(s.de||1)/3)*7;return Math.min(98,Math.round(sc));},
        growth(s){if(!s.paysDividend)return{cagr:0,conf:0,sig:'⚪'};const pf=(s.promoter||30)>55?1.12:(s.promoter||30)>30?1.05:0.95;const pof=(s.payoutRatio||50)<65?1.08:(s.payoutRatio||50)>88?0.88:1;const cm={'Very Strong':1.15,'Strong':1.07,'Moderate':0.97,'Neutral':0.9,'Weak':0.8};const cf=cm[s.fiidii]||0.95;const pg=(s.divGrowth3Y||0)*pf*pof*cf;return{cagr:Math.round(pg*10)/10,sig:pg>20?'🚀 High':pg>10?'✅ Steady':pg>3?'📊 Moderate':'⚠️ Low'};},
        rec(s){if(!s.paysDividend)return{t:'No Dividend',c:'gray'};const h=this.health(s),p=this.growth(s);if(h>=85&&p.cagr>15)return{t:'Strong Buy',c:'green'};if(h>=72&&p.cagr>8)return{t:'Buy',c:'blue'};if(h>=60&&p.cagr>3)return{t:'Hold',c:'yellow'};return{t:'Review',c:'red'};},
        sustain(s){if(!s.paysDividend)return{sc:0,c:'gray'};const fc=(s.fcf||0)>0?Math.min(2,((s.fcf||0)/1000)/((s.divPerShare||1)*100)):0;const pc=(s.payoutRatio||50)<40?1:(s.payoutRatio||50)<65?0.8:(s.payoutRatio||50)<85?0.5:0.2;const ds=Math.max(0,1-(s.de||1)/2);const cf=(s.divConsistency||0)/30;const score=Math.round((fc*0.35+pc*0.25+ds*0.2+cf*0.2)*100);return{sc:Math.min(98,score),c:score>=75?'green':score>=55?'blue':score>=35?'yellow':'red'};}
    };

    // State
    const ST = {tab:'dashboard',wl:JSON.parse(localStorage.getItem('dswl')||'[]'),pf:JSON.parse(localStorage.getItem('dspf')||'[]'),cmp:JSON.parse(localStorage.getItem('dscmp')||'[]'),filter:'all',page:1,sortCol:'score',sortDir:'desc',query:''};

    function toast(m,t='info'){const c=document.getElementById('toastContainer');const cl={success:'bg-green-600',info:'bg-blue-600',warning:'bg-yellow-600',error:'bg-red-600'};const d=document.createElement('div');d.className=`${cl[t]} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs`;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500);}
    function fmt(n){if(Math.abs(n)>=1e7)return`₹${(n/1e7).toFixed(2)} Cr`;if(Math.abs(n)>=1e5)return`₹${(n/1e5).toFixed(2)} L`;return`₹${n.toFixed(2)}`;}

    function sortList(list,col,dir){return[...list].sort((a,b)=>{let va,vb;switch(col){case'symbol':va=a.symbol||'';vb=b.symbol||'';break;case'price':va=a.price||0;vb=b.price||0;break;case'yield':va=a.divYield||0;vb=b.divYield||0;break;case'growth':va=a.divGrowth3Y||0;vb=b.divGrowth3Y||0;break;case'score':va=AI.health(a);vb=AI.health(b);break;case'sustainability':va=AI.sustain(a).sc;vb=AI.sustain(b).sc;break;default:return 0;}if(typeof va==='string')return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);return dir==='asc'?va-vb:vb-va;});}
    function getFiltered(filter){let list=[...stocks];if(filter==='high-yield')list=list.filter(s=>s.paysDividend&&s.divYield>4);if(filter==='high-growth')list=list.filter(s=>s.paysDividend&&s.divGrowth3Y>20);if(filter==='watchlist')list=list.filter(s=>ST.wl.includes(s.symbol));if(filter==='portfolio')list=list.filter(s=>ST.pf.some(p=>p.symbol===s.symbol));if(filter==='non-payers')list=list.filter(s=>!s.paysDividend);if(filter==='payers')list=list.filter(s=>s.paysDividend);if(ST.query&&(filter==='search'||filter==='all')){const q=ST.query.toUpperCase().trim();list=list.filter(s=>s.symbol.includes(q)||s.name.toUpperCase().includes(q)||s.sector.toUpperCase().includes(q));}if(ST.sortCol)list=sortList(list,ST.sortCol,ST.sortDir);return list;}
    function doSort(col){if(ST.sortCol===col)ST.sortDir=ST.sortDir==='asc'?'desc':'asc';else{ST.sortCol=col;ST.sortDir='desc';}ST.page=1;renderView();}
    function sortInd(col){if(ST.sortCol!==col)return'<span style="opacity:0.3;color:#6b7280;margin-left:4px;">▼</span>';return`<span style="color:#22c55e;margin-left:4px;display:inline-block;transform:rotate(${ST.sortDir==='asc'?'0':'180'}deg);">▼</span>`;}

    function showDetail(symbol){ST.selectedStock=symbol;ST.tab='detail';renderDetail(symbol);window.scrollTo({top:0,behavior:'smooth'});}

    // ============================================
    // MAIN RENDER
    // ============================================
    function renderView(){
        const app=document.getElementById('appContent');
        app.innerHTML='';
        switch(ST.tab){
            case'dashboard':renderDashboard();break;
            case'toppayers':renderTopPayers();break;
            case'screener':renderScreener();break;
            case'blog':renderBlog();break;
            case'portfolio':renderPortfolio();break;
            case'compare':renderCompare();break;
            case'detail':if(ST.selectedStock)renderDetail(ST.selectedStock);break;
        }
        lucide.createIcons();
    }

    function renderDashboard(){
        const top=[...stocks.filter(s=>s.paysDividend)].sort((a,b)=>AI.health(b)-AI.health(a)).slice(0,6);
        const list=getFiltered(ST.filter);
        const avgY=payers.length>0?(payers.reduce((s,st)=>s+st.divYield,0)/payers.length).toFixed(2):'0';
        document.getElementById('appContent').innerHTML=`
        <div class="space-y-4">
            <div class="grid grid-cols-2 md:grid-cols-6 gap-2">
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">NSE Stocks</p><p class="text-xl font-black">${stocks.length}</p></div>
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">Payers</p><p class="text-xl font-black text-green-400">${payers.length}</p></div>
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">Avg Yield</p><p class="text-xl font-black text-yellow-400">${avgY}%</p></div>
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">Watchlist</p><p class="text-xl font-black text-blue-400">${ST.wl.length}</p></div>
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">Portfolio</p><p class="text-xl font-black text-purple-400">${ST.pf.length}</p></div>
                <div class="data-card rounded-xl p-3"><p class="text-[10px] text-gray-500">Blog</p><p class="text-xl font-black text-orange-400">${getBlogPosts().filter(p=>p.published).length}</p></div>
            </div>
            <div class="glow-border rounded-2xl"><div class="data-card rounded-2xl p-4"><h3 class="font-bold text-base mb-3">🏆 Top AI Dividend Scores</h3><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">${top.map(s=>{const h=AI.health(s),r=AI.rec(s);return`<div class="data-card clickable rounded-xl p-3 text-center" onclick="showDetail('${s.symbol}')"><p class="font-bold text-xs">${s.symbol}</p><p class="text-2xl font-black text-${r.c}-400">${h}</p><p class="text-[10px] text-${r.c}-400">${r.t}</p><p class="text-[10px] text-gray-500 mt-1">Yield: ${s.divYield.toFixed(1)}%</p></div>`;}).join('')}</div></div></div>
            <div class="flex gap-1.5 flex-wrap">${['all','payers','high-yield','high-growth','watchlist','non-payers','portfolio'].map(f=>{const labels={all:'All',payers:'Payers','high-yield':'Hi-Yield >4%','high-growth':'Hi-Growth >20%',watchlist:`⭐ ${ST.wl.length}`,'non-payers':'Non-Payers',portfolio:'💼 Mine'};return`<button onclick="ST.filter='${f}';ST.page=1;renderView()" class="filter-btn px-3 py-1.5 rounded-lg text-[10px] font-semibold border ${ST.filter===f?'filter-active':'text-gray-400 border-white/10'}">${labels[f]}</button>`;}).join('')}</div>
            <div class="data-card rounded-2xl p-3">${renderTable(list,ST.page)}</div>
        </div>`;
        document.getElementById('stockCountFooter').textContent=`${stocks.length} NSE Stocks • ${payers.length} Payers`;
    }

    function renderTable(list,page=1){
        const tp=Math.ceil(list.length/50);const start=(page-1)*50;const paged=list.slice(start,start+50);
        if(list.length===0)return'<div class="text-center py-8 text-gray-500 text-sm">No stocks match.</div>';
        let h=`<div class="text-xs text-gray-500 mb-2">${start+1}-${Math.min(start+50,list.length)} of ${list.length}</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b border-white/5">`;
        h+=`<th class="pb-3 text-left sortable" onclick="doSort('symbol')">Stock ${sortInd('symbol')}</th><th class="pb-3 text-right sortable" onclick="doSort('price')">Price ${sortInd('price')}</th><th class="pb-3 text-right sortable" onclick="doSort('yield')">Yield ${sortInd('yield')}</th><th class="pb-3 text-right sortable" onclick="doSort('growth')">3Y Growth ${sortInd('growth')}</th><th class="pb-3 text-center sortable" onclick="doSort('score')">AI Score ${sortInd('score')}</th><th class="pb-3 text-center">⭐</th></tr></thead><tbody class="divide-y divide-white/5">`;
        paged.forEach(s=>{const hl=AI.health(s);const wl=ST.wl.includes(s.symbol);
            h+=`<tr class="stock-row" onclick="showDetail('${s.symbol}')"><td class="py-2.5"><span class="font-semibold">${s.symbol}</span><span class="text-gray-500 text-xs ml-1">${s.name.substring(0,16)}</span></td><td class="py-2.5 text-right font-mono text-xs">₹${s.price.toFixed(0)}</td><td class="py-2.5 text-right ${s.divYield>4?'text-yellow-400 font-bold':'text-green-400'} text-xs">${s.paysDividend?s.divYield.toFixed(2)+'%':'—'}</td><td class="py-2.5 text-right ${s.divGrowth3Y>15?'text-green-400':s.divGrowth3Y>=0?'text-blue-400':'text-red-400'} text-xs">${s.paysDividend?(s.divGrowth3Y>0?'+':'')+s.divGrowth3Y.toFixed(1)+'%':'—'}</td><td class="py-2.5 text-center"><span class="px-2 py-0.5 rounded-full text-xs font-bold ${hl>=80?'bg-green-500/20 text-green-400':hl>=60?'bg-blue-500/20 text-blue-400':hl>=35?'bg-yellow-500/20 text-yellow-400':'bg-gray-500/20 text-gray-400'}">${hl}</span></td><td class="py-2.5 text-center">${wl?'★':'☆'}</td></tr>`;});
        h+=`</tbody></table></div>`;
        if(tp>1)h+=`<div class="flex justify-center items-center gap-3 mt-4"><button onclick="ST.page=${page-1};renderView()" class="px-3 py-1.5 rounded-lg bg-white/5 text-xs ${page===1?'opacity-30':''}">←</button><span class="text-xs text-gray-400">${page}/${tp}</span><button onclick="ST.page=${page+1};renderView()" class="px-3 py-1.5 rounded-lg bg-white/5 text-xs ${page===tp?'opacity-30':''}">→</button></div>`;
        return h;
    }

    function renderTopPayers(){const prevC=ST.sortCol,prevD=ST.sortDir;ST.sortCol='yield';ST.sortDir='desc';const top=getFiltered('payers').slice(0,50);ST.sortCol=prevC;ST.sortDir=prevD;document.getElementById('appContent').innerHTML=`<div class="space-y-4"><h2 class="text-2xl font-black">🏆 Top Dividend Payers</h2><div class="data-card rounded-2xl p-3">${renderTable(top,1)}</div></div>`;lucide.createIcons();}
    function renderScreener(){document.getElementById('appContent').innerHTML=`<div class="space-y-4"><h2 class="text-2xl font-black">AI Dividend Screener</h2><p class="text-gray-500 text-center py-12">Screener ready</p></div>`;lucide.createIcons();}
    function renderPortfolio(){document.getElementById('appContent').innerHTML=`<div class="space-y-4"><h2 class="text-2xl font-black">Your Portfolio</h2><div class="data-card rounded-2xl p-10 text-center"><p class="text-gray-500">Portfolio ready</p></div></div>`;lucide.createIcons();}
    function renderCompare(){document.getElementById('appContent').innerHTML=`<div class="space-y-4"><h2 class="text-2xl font-black">Peer Comparison</h2><div class="data-card rounded-2xl p-10 text-center"><p class="text-gray-500">Compare ready</p></div></div>`;lucide.createIcons();}
    function renderDetail(symbol){const s=stocks.find(t=>t.symbol===symbol);if(!s)return;const h=AI.health(s),r=AI.rec(s);document.getElementById('appContent').innerHTML=`<div class="space-y-4"><button onclick="switchTab('dashboard')" class="text-gray-400 hover:text-white text-xs">← Back</button><div class="data-card rounded-2xl p-5"><h2 class="text-2xl font-black">${s.symbol}</h2><p class="text-gray-400">${s.name} • ${s.sector}</p><p class="text-xs text-gray-500">Mkt Cap: ${s.mcap} • P/E: ${s.pe}</p></div>${s.paysDividend?`<div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="data-card rounded-2xl p-4"><h3 class="font-bold text-sm">AI Health</h3><p class="text-5xl font-black text-${r.c}-400">${h}</p></div><div class="data-card rounded-2xl p-4"><h3 class="font-bold text-sm">Growth</h3><p class="text-4xl font-black text-blue-400">${AI.growth(s).cagr>0?'+':''}${AI.growth(s).cagr}%</p></div><div class="data-card rounded-2xl p-4"><h3 class="font-bold text-sm">Stats</h3><p class="text-4xl font-black text-green-400">${s.divYield.toFixed(2)}%</p></div></div>`:''}</div>`;lucide.createIcons();}

    // ============================================
    // NAVIGATION
    // ============================================
    function switchTab(tab){
        console.log('🔄 Switching to tab:', tab);
        ST.tab=tab;ST.selectedStock=null;ST.page=1;ST.filter='all';ST.query='';
        document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('text-green-400','nav-active');b.classList.add('text-gray-300');});
        const nb=document.querySelector(`[data-nav="${tab}"]`);
        if(nb){nb.classList.add('text-green-400','nav-active');nb.classList.remove('text-gray-300');}
        renderView();
        window.scrollTo({top:0,behavior:'smooth'});
    }

    // ============================================
    // INITIALIZE
    // ============================================
    document.addEventListener('DOMContentLoaded',()=>{
        console.log('🚀 DividendStrike initializing...');
        console.log('📊 Stocks loaded:', stocks.length);
        console.log('📝 Blog posts in storage:', getBlogPosts().length);
        switchTab('dashboard');
        document.getElementById('stockCountFooter').textContent=`${stocks.length} NSE Stocks • ${payers.length} Payers`;
        setInterval(()=>{const el=document.getElementById('liveClock');if(el)el.textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});},1000);
    });

    console.log('✅ DividendStrike script loaded');
    </script>
</body>
</html>
