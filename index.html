        #liveClock { display:inline-block; min-width:70px; text-align:center; font-variant-numeric:tabular-nums; }
        /* Scroll to Top Button */
.scroll-top-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(34,197,94,0.3);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
}

.scroll-top-btn.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.scroll-top-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(34,197,94,0.5);
    background: linear-gradient(135deg, #16a34a, #15803d);
}

.scroll-top-btn:active {
    transform: scale(0.9);
}

.scroll-top-btn .arrow-icon {
    color: white;
    font-size: 20px;
    font-weight: 700;
    transition: transform 0.3s ease;
    line-height: 1;
}

.scroll-top-btn:hover .arrow-icon {
    transform: translateY(-3px);
}

/* Pulse ring effect */
.scroll-top-btn::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    border: 2px solid rgba(34,197,94,0.3);
    animation: pulse-ring 2s ease-out infinite;
}

@keyframes pulse-ring {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    100% {
        transform: scale(1.4);
        opacity: 0;
    }
}

/* Progress ring around button */
.scroll-top-btn .progress-ring {
    position: absolute;
    top: -4px;
    left: -4px;
    width: 56px;
    height: 56px;
    transform: rotate(-90deg);
}

.scroll-top-btn .progress-ring circle {
    fill: none;
    stroke: rgba(34,197,94,0.3);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease;
}

/* Mobile responsive */
@media (max-width: 768px) {
    .scroll-top-btn {
        bottom: 20px;
        right: 20px;
        width: 42px;
        height: 42px;
        border-radius: 14px;
    }
}
    </style>

function getBlogPosts() {
    try {
        const posts = localStorage.getItem('dividendstrike_blog_posts');
        return posts ? JSON.parse(posts) : [];
    } catch(e) { return []; }
}

function renderBlog() {
    window.scrollTo({top: 0, behavior: 'instant'});
    handleScrollButton();
    const allPosts = getBlogPosts();
    const posts = allPosts.filter(p => p.published).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const app = document.getElementById('appContent');
    
    if (posts.length === 0) {
        app.innerHTML = `
        <div class="min-h-[60vh] flex items-center justify-center">
            <div class="text-center">
                <div class="w-20 h-20 bg-gradient-to-br from-green-500/20 to-emerald-600/20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <span style="font-size:40px;">📝</span>
                </div>
                <h2 class="text-2xl font-black mb-2">No Articles Yet</h2>
                <p class="text-gray-400 text-sm max-w-md mx-auto">Our research team is preparing comprehensive dividend investing guides. Check back soon!</p>
            </div>
        </div>`;
        lucide.createIcons();
        return;
    }
    
    const featured = posts[0];
    const remaining = posts.slice(1);
    
    app.innerHTML = `
    <div class="space-y-8">
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-green-900/40 via-emerald-900/30 to-blue-900/40 p-8 lg:p-12 border border-white/5">

            <div class="relative z-10">
                <div class="flex items-center gap-3 mb-4">
                    <span class="px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-xs font-semibold">📚 Knowledge Base</span>
                    <span class="text-xs text-gray-500">${posts.length} articles</span>
                </div>
                <h1 class="text-3xl lg:text-4xl font-black mb-3">Dividend Investing <span class="text-green-400">Guides & Analysis</span></h1>
                <p class="text-gray-400 text-sm lg:text-base max-w-2xl">Expert research on the best dividend paying stocks in India. AI-powered analysis, proven strategies, and actionable insights for building passive income through NSE dividend stocks.</p>
            </div>
        </div>
        
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#111118] to-[#0d1117] border border-white/5 cursor-pointer group" onclick="renderBlogPost('${featured.id}')">
            <div class="absolute top-0 right-0 w-96 h-96 bg-green-500/5 rounded-full blur-5xl group-hover:bg-green-500/10 transition-all"></div>
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-0">
                <div class="lg:col-span-3 p-8 lg:p-10 relative z-10">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="px-2.5 py-1 bg-yellow-500/20 text-yellow-400 rounded-full text-[10px] font-bold uppercase tracking-wider">⭐ Featured</span>
                        <span class="px-2.5 py-1 bg-green-500/20 text-green-400 rounded-full text-[10px] font-semibold">${featured.category || 'General'}</span>
                    </div>
                    <h2 class="text-2xl lg:text-3xl font-black mb-3 group-hover:text-green-400 transition-colors leading-tight">${featured.title}</h2>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3">${featured.excerpt || featured.content.replace(/<[^>]*>/g,'').substring(0,200)+'...'}</p>
                    <div class="flex items-center gap-4 text-xs text-gray-500">
                        <span class="flex items-center gap-1.5"><span class="w-6 h-6 bg-green-500/20 rounded-full flex items-center justify-center text-[10px]">✍️</span> ${featured.author || 'DividendStrike'}</span>
                        <span class="flex items-center gap-1.5">📅 ${new Date(featured.created_at).toLocaleDateString('en-IN',{day:'numeric', month:'short', year:'numeric'})}</span>
                        <span class="flex items-center gap-1.5">⏱️ ${featured.read_time || '8 min read'}</span>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-gradient-to-br from-green-900/30 to-emerald-900/20 flex items-center justify-center p-8 relative z-10">
                    <div class="text-center"><div class="text-6xl mb-3">📊</div><p class="text-green-400 text-sm font-semibold">AI-Powered Analysis</p><p class="text-gray-500 text-xs mt-1">17 Factors Evaluated</p></div>
                </div>
            </div>
        </div>
        
        <div class="flex gap-2 flex-wrap">
            ${['All','Stock Lists','Strategy','Tax Guide','PSU Analysis','Market News'].map(cat => `
                <button class="px-4 py-2 rounded-xl text-xs font-semibold border transition-all ${cat === 'All' ? 'bg-green-500/20 border-green-500/30 text-green-400' : 'border-white/10 text-gray-400 hover:border-white/30 hover:text-white'}">${cat}</button>
            `).join('')}

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${remaining.map((post, index) => `
                <div class="group cursor-pointer" onclick="renderBlogPost('${post.id}')">
                    <div class="data-card rounded-2xl p-6 h-full flex flex-col hover:border-green-500/30 transition-all duration-300">
                        <div class="h-1.5 bg-gradient-to-r ${index % 3 === 0 ? 'from-green-500 to-emerald-600' : index % 3 === 1 ? 'from-blue-500 to-purple-600' : 'from-yellow-500 to-orange-600'} rounded-full mb-4 w-16 group-hover:w-24 transition-all duration-500"></div>
                        <div class="flex items-center gap-2 mb-3">

                        <div class="flex items-center justify-between pt-3 border-t border-white/5">
                            <span class="text-[10px] text-gray-500">✍️ ${post.author || 'DividendStrike'}</span>
                            <span class="text-[10px] text-green-400 font-medium group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">Read →</span>

function renderBlogPost(postId) {
    window.scrollTo({top: 0, behavior: 'instant'});
    handleScrollButton();
    const posts = getBlogPosts();
    const post = posts.find(p => p.id === postId);
    const app = document.getElementById('appContent');
    
    if (!post) {
        app.innerHTML = `<div class="text-center py-20"><p class="text-gray-500">Post not found</p><button onclick="renderBlog()" class="mt-4 px-4 py-2 bg-green-600 rounded-lg text-sm">← Back</button></div>`;
        return;
    }
    
    const related = posts.filter(p => p.id !== post.id && p.category === post.category && p.published).slice(0, 3);
    const allRelated = related.length > 0 ? related : posts.filter(p => p.id !== post.id && p.published).slice(0, 3);
    
    app.innerHTML = `
    <div class="max-w-4xl mx-auto space-y-8">
        <button onclick="renderBlog()" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm group transition-all"><span class="group-hover:-translate-x-1 transition-transform">←</span> Back to All Articles</button>
        
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#0d1117] via-[#111118] to-[#0a0f14] border border-white/5 p-8 lg:p-10">
            <div class="absolute top-0 right-0 w-80 h-80 bg-green-500/5 rounded-full blur-5xl"></div>
            <div class="relative z-10">
                <div class="flex flex-wrap items-center gap-3 mb-4">
                    <span class="px-3 py-1.5 bg-green-500/20 text-green-400 rounded-full text-xs font-bold">${post.category || 'General'}</span>
                    <span class="text-xs text-gray-500">📅 ${new Date(post.created_at).toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</span>
                    <span class="text-xs text-gray-500">⏱️ ${post.read_time || '8 min read'}</span>
                </div>
                <h1 class="text-2xl lg:text-4xl font-black leading-tight mb-4">${post.title}</h1>
                ${post.excerpt ? `<p class="text-gray-400 text-base lg:text-lg leading-relaxed">${post.excerpt}</p>` : ''}
                <div class="flex items-center gap-3 mt-6 pt-4 border-t border-white/5">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full flex items-center justify-center text-white font-bold text-sm">DS</div>
                    <div><p class="text-sm font-semibold">${post.author || 'DividendStrike Research'}</p><p class="text-xs text-gray-500">AI-Powered Dividend Analysis</p></div>
                </div>
            </div>
        </div>
        
        <article class="data-card rounded-2xl p-6 lg:p-10">
            <div class="blog-post-content" style="line-height:1.9;color:#d1d5db;font-size:16px;">${post.content}</div>
            
            ${post.keywords && post.keywords.length > 0 ? `
            <div class="mt-10 pt-6 border-t border-white/5">
                <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Related Topics</p>
                <div class="flex flex-wrap gap-2">${post.keywords.map(kw => `<span class="px-3 py-1.5 bg-white/5 hover:bg-green-500/10 text-gray-400 hover:text-green-400 rounded-lg text-xs cursor-pointer transition-all border border-white/5 hover:border-green-500/20">#${kw.trim()}</span>`).join('')}</div>
            </div>` : ''}
            
            <div class="mt-8 pt-6 border-t border-white/5">
                <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Share This Article</p>
                <div class="flex gap-3">
                    <button onclick="shareArticle('twitter', '${post.title.replace(/'/g,"\\'")}')" class="px-4 py-2.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded-xl text-sm font-medium transition-all">🐦 Tweet</button>
                    <button onclick="copyArticleLink()" class="px-4 py-2.5 bg-purple-600/20 hover:bg-purple-600/30 text-purple-400 rounded-xl text-sm font-medium transition-all">📋 Copy Link</button>
                </div>
            </div>
        </article>
        
        ${allRelated.length > 0 ? `
        <div>
            <div class="flex items-center gap-3 mb-5"><div class="h-0.5 flex-1 bg-white/5"></div><h3 class="text-lg font-bold text-gray-300 px-4">📚 Related Articles</h3><div class="h-0.5 flex-1 bg-white/5"></div></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                ${allRelated.map(rp => `<div class="data-card rounded-2xl p-5 cursor-pointer group hover:border-green-500/30 transition-all" onclick="renderBlogPost('${rp.id}')"><span class="px-2 py-0.5 bg-green-500/10 text-green-400 rounded-full text-[9px] font-semibold">${rp.category}</span><h4 class="font-bold text-sm mt-3 mb-2 group-hover:text-green-400 transition-colors line-clamp-2">${rp.title}</h4><p class="text-[10px] text-gray-500">📅 ${new Date(rp.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</p></div>`).join('')}
            </div>
        </div>` : ''}
        
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-green-900/40 to-emerald-900/30 border border-green-500/10 p-8 text-center">
            <div class="absolute top-0 right-0 w-48 h-48 bg-green-500/10 rounded-full blur-3xl"></div>
            <div class="relative z-10">
                <span class="text-4xl mb-3 block">📬</span>
                <h3 class="text-xl font-black mb-2">Get Weekly Dividend Stock Alerts</h3>
                <p class="text-gray-400 text-sm mb-4 max-w-md mx-auto">Join smart investors who receive our top dividend picks every Saturday.</p>
                <div class="flex gap-2 max-w-md mx-auto">
                    <input type="email" placeholder="your@email.com" class="flex-1 bg-[#1a1a2e] border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-green-500/50">
                    <button class="bg-green-600 hover:bg-green-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition-all">Subscribe</button>
                </div>
            </div>
        </div>
    </div>`;
    
    lucide.createIcons();
    window.scrollTo({top: 0, behavior: 'smooth'});
    setTimeout(styleBlogContent, 200);
}

function styleBlogContent() {
    document.querySelectorAll('.blog-post-content table').forEach(table => {
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.margin = '24px 0';
        table.style.fontSize = '14px';
        table.style.borderRadius = '12px';
        table.style.overflow = 'hidden';
    });
    document.querySelectorAll('.blog-post-content th').forEach(th => {
        th.style.background = 'linear-gradient(135deg, rgba(34,197,94,0.15), rgba(16,185,129,0.1))';
        th.style.color = '#22c55e';
        th.style.padding = '14px 18px';
        th.style.textAlign = 'left';
        th.style.borderBottom = '2px solid rgba(34,197,94,0.3)';
        th.style.fontWeight = '700';
        th.style.fontSize = '13px';
    });
    document.querySelectorAll('.blog-post-content td').forEach(td => {
        td.style.padding = '12px 18px';
        td.style.borderBottom = '1px solid rgba(255,255,255,0.04)';
        td.style.color = '#d1d5db';
    });
    document.querySelectorAll('.blog-post-content h2').forEach(h2 => {
        h2.style.fontSize = '1.5rem';
        h2.style.fontWeight = '800';
        h2.style.color = '#f3f4f6';
        h2.style.marginTop = '2rem';
        h2.style.marginBottom = '1rem';

function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

function handleScrollButton() {
    const btn = document.getElementById('scrollToTopBtn');
    if (!btn) return;
    
    // Show button after scrolling down 400px
    if (window.scrollY > 400) {
        btn.classList.add('show');
    } else {
        btn.classList.remove('show');
    }
    
    // Update progress indicator (optional - calculates scroll percentage)
    const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
    const scrollProgress = (window.scrollY / scrollTotal) * 100;
    
    // Change button style based on scroll depth
    if (scrollProgress > 80) {
        btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        btn.querySelector('.arrow-icon').textContent = '🏠';
    } else if (scrollProgress > 50) {
        btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
        btn.querySelector('.arrow-icon').textContent = '↑';
    } else {
        btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
        btn.querySelector('.arrow-icon').textContent = '↑';
    }
}

// Add scroll event listener
window.addEventListener('scroll', handleScrollButton, { passive: true });

// Check button visibility on page load
document.addEventListener('DOMContentLoaded', function() {
    handleScrollButton();
});
